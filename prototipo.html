const LEGAL={
privacidad:{t:'Política de privacidad',intro:`<p>En Aquí Somos Buena Música («el festival», «nosotros») cuidamos tus datos personales. Esta política explica qué datos recogemos en esta web, para qué los usamos, con quién los compartimos y cómo puedes ejercer tus derechos, de acuerdo con la Ley n.º 172-13 sobre Protección de Datos de Carácter Personal de la República Dominicana y la normativa que la complemente o sustituya.</p>`,secs:[
['Quién es responsable de tus datos',`<p>El responsable del tratamiento es Aquí Somos Buena Música, ${PD('razón social y RNC de la entidad responsable: por definir')}, con domicilio en ${PD('dirección: por definir')}, Santo Domingo, República Dominicana.</p><p>Para cualquier asunto de privacidad, escríbenos a ${PD('correo de privacidad: por definir')} o usa el <a href="#p08">formulario de contacto</a>.</p>`],
['Qué datos recogemos',`<ul>
<li><b>Cuenta de asistente:</b> nombre y apellido, correo y contraseña. La contraseña se guarda cifrada; nadie del equipo puede verla.</li>
<li><b>Boleta:</b> tu nombre, tu correo, el código de la boleta, su estado y el registro de entrada el día del festival.</li>
<li><b>Cuenta y postulación de artista:</b> nombre artístico, tipo de proyecto, persona de contacto, correo, teléfono, provincia o ciudad, número de integrantes, géneros, descripción, trayectoria, fotografía, enlaces a tu música, a un video en vivo y a tus redes, disponibilidad, formato de presentación, necesidades técnicas y las respuestas del formulario.</li>
<li><b>Compras en la tienda:</b> nombre, correo, teléfono, dirección de entrega si eliges envío y el detalle del pedido. El pago lo procesa una pasarela externa; no guardamos los datos completos de tu tarjeta.</li>
<li><b>Comunidad:</b> los comentarios y las fotografías que publiques, con sus pies de foto y el nombre de tu cuenta.</li>
<li><b>Inicio de sesión con Google:</b> si eliges esta opción, Google nos comparte tu nombre, tu correo y tu foto de perfil. Nunca recibimos tu contraseña de Google. Puedes desconectarla en <b>Mi cuenta › Configuración</b>.</li>
<li><b>Contacto:</b> nombre, correo, tema y mensaje.</li>
<li><b>Preferencias:</b> los correos que aceptas recibir.</li>
<li><b>Datos técnicos:</b> dirección IP, tipo de navegador y dispositivo, páginas visitadas y cookies necesarias para mantener tu sesión. ${PD('Herramientas de analítica: por definir')}</li></ul>`],
['Para qué los usamos',`<ul>
<li>Crear y gestionar tu cuenta.</li>
<li>Emitir y validar tu boleta, controlar el aforo y garantizar una boleta por persona.</li>
<li>Revisar las postulaciones de artistas, comunicar resultados y, si te seleccionan y lo autorizas, publicar tu perfil y difundir tu participación.</li>
<li>Procesar, entregar y dar seguimiento a tus pedidos.</li>
<li>Publicar y moderar comentarios y fotografías.</li>
<li>Responder tus mensajes.</li>
<li>Enviarte avisos necesarios sobre el festival (cambios de fecha, horario o lugar, estado de tu boleta, pedido o postulación) y, solo si lo aceptas, novedades.</li>
<li>Proteger la plataforma frente a fraudes, abusos y accesos no autorizados.</li>
<li>Elaborar estadísticas agregadas de asistencia y uso, sin identificar a nadie.</li></ul>`],
['Por qué podemos usarlos',`<p>Tratamos tus datos porque nos das tu consentimiento al registrarte, obtener una boleta, postularte, comprar o escribirnos; porque son necesarios para darte el servicio que pides; para cumplir obligaciones legales, y por nuestro interés legítimo en mantener la plataforma segura. Puedes retirar tu consentimiento en cualquier momento; eso no afecta lo realizado antes.</p>`],
['Con quién los compartimos',`<p><b>No vendemos ni alquilamos tus datos.</b> Solo los compartimos con:</p><ul>
<li>Proveedores que nos ayudan a operar la web (alojamiento, envío de correos, inicio de sesión con Google, pasarela de pago y ${PD('servicio de mensajería o entrega: por definir')}), que solo pueden usarlos para prestarnos ese servicio.</li>
<li>El personal de acceso del festival, que ve tu nombre y el código de tu boleta para validarla.</li>
<li>El comité que evalúa las postulaciones de artistas.</li>
<li>Autoridades competentes, cuando la ley lo exija.</li></ul>
<p>Lo que publicas voluntariamente (comentarios, fotografías) y el perfil de los artistas seleccionados es visible para cualquier visitante.</p>`],
['Datos fuera de la República Dominicana',`<p>Algunos proveedores pueden almacenar datos en servidores de otros países. En ese caso elegimos proveedores que ofrezcan garantías adecuadas de protección. ${PD('Lista de proveedores y países: por definir')}</p>`],
['Cuánto tiempo los guardamos',`<ul>
<li><b>Cuenta:</b> mientras esté activa. Si la eliminas, borramos o anonimizamos tus datos en un plazo de ${PD('plazo: por definir')}, salvo los que debamos conservar por ley (por ejemplo, datos de facturación).</li>
<li><b>Boletas y registro de entrada:</b> ${PD('plazo después del festival: por definir')}.</li>
<li><b>Postulaciones no seleccionadas:</b> ${PD('plazo: por definir')}.</li>
<li><b>Mensajes de contacto:</b> ${PD('plazo: por definir')}.</li></ul>`],
['Tus derechos',`<p>Puedes pedir en cualquier momento:</p><ul>
<li><b>Acceso:</b> saber qué datos tuyos tenemos.</li>
<li><b>Rectificación:</b> corregir datos inexactos.</li>
<li><b>Cancelación:</b> que eliminemos tus datos.</li>
<li><b>Oposición:</b> que dejemos de usarlos para un fin concreto, como el envío de novedades.</li></ul>
<p>Muchas de estas acciones puedes hacerlas tú desde <b>Mi cuenta</b>: editar tus datos, cambiar tus preferencias de correo o eliminar tu cuenta. Para lo demás, escríbenos a ${PD('correo de privacidad: por definir')}; te responderemos en un plazo de ${PD('plazo: por definir')}. Si consideras que no atendimos tu solicitud, puedes acudir a los tribunales mediante la acción de habeas data.</p>`],
['Menores de edad',`<p>La plataforma está dirigida a personas de ${PD('edad mínima: por definir')} años o más. Las personas menores de esa edad necesitan la autorización de su madre, padre o tutor para crear una cuenta, obtener una boleta o postularse. No está permitido publicar fotografías en las que aparezcan menores identificables sin el consentimiento de sus responsables.</p>`],
['Seguridad',`<p>Usamos conexión cifrada (HTTPS), contraseñas cifradas y acceso restringido a los datos solo para el personal que los necesita. Ningún sistema es infalible: si ocurre un incidente que afecte tus datos, te lo comunicaremos y tomaremos medidas para limitar sus efectos.</p>`],
['Cookies',`<p>Usamos cookies necesarias para que la web funcione: mantener tu sesión, recordar tu carrito y tus preferencias. ${PD('Cookies de analítica o de terceros: por definir')}; si se usan, te pediremos permiso antes de activarlas.</p><p>Al reproducir música o videos incrustados de otras plataformas, estas pueden instalar sus propias cookies según sus políticas.</p>`],
['Cambios en esta política',`<p>Si cambiamos esta política, publicaremos la nueva versión con su fecha. Si el cambio es importante, también te avisaremos por correo.</p>`]]},

terminos:{t:'Términos de uso',intro:`<p>Estos términos regulan el uso de la web de Aquí Somos Buena Música. Al navegar por ella, crear una cuenta o publicar contenido aceptas estos términos, junto con la <a href="#p09-privacidad">política de privacidad</a> y las <a href="#p09-comunidad">normas de la comunidad</a>. Si no estás de acuerdo, no uses la plataforma.</p>`,secs:[
['Quiénes somos',`<p>Aquí Somos Buena Música es una iniciativa de festivales gratuitos para visibilizar la diversidad musical dominicana y a sus artistas independientes y emergentes. Titular de la plataforma: ${PD('razón social y RNC: por definir')}.</p>`],
['Qué ofrece la plataforma',`<p>Información sobre el festival, boletas gratuitas, la convocatoria para artistas, un blog, una galería de la comunidad y una tienda de productos oficiales. La obtención de boletas, las postulaciones y las compras se rigen además por los <a href="#p09-condiciones">términos y condiciones</a>.</p>`],
['Tu cuenta',`<ul>
<li>Hay cuentas de asistente y de artista. Al crearla debes dar datos verdaderos y mantenerlos al día.</li>
<li>Cada persona puede tener una sola cuenta de asistente. Puedes crearla con tu correo y una contraseña o con tu cuenta de Google.</li>
<li>Eres responsable de guardar tu contraseña y de lo que se haga con tu cuenta. Si sospechas que alguien la usa sin permiso, cámbiala y avísanos.</li>
<li>Para registrarte debes tener ${PD('edad mínima: por definir')} años o contar con la autorización de tu madre, padre o tutor.</li>
<li>Puedes eliminar tu cuenta desde <b>Mi cuenta › Configuración</b>. Al hacerlo se anulan tus boletas activas.</li>
<li>Podemos suspender o cerrar cuentas que incumplan estos términos.</li></ul>`],
['Lo que no está permitido',`<ul>
<li>Suplantar a otra persona o artista, o crear cuentas falsas o duplicadas.</li>
<li>Obtener boletas de forma automatizada, acapararlas o revenderlas.</li>
<li>Publicar contenido ilegal, ofensivo, discriminatorio, violento, sexual o que vulnere derechos de terceros.</li>
<li>Enviar spam, publicidad no autorizada o enlaces engañosos.</li>
<li>Intentar acceder a cuentas, datos o zonas restringidas, o afectar el funcionamiento de la web.</li>
<li>Copiar o reutilizar con fines comerciales el contenido de la plataforma sin permiso.</li></ul>`],
['El contenido que publicas',`<p>Sigues siendo dueño o dueña de lo que publicas (comentarios, fotografías, textos y materiales de tu perfil). Al publicarlo nos das permiso gratuito y no exclusivo para mostrarlo en la plataforma y en los canales del festival con fines de difusión, mientras siga publicado ${PD('y en el archivo de cada edición: por definir')}.</p><p>Al publicar confirmas que el contenido es tuyo o que tienes permiso para compartirlo, incluido el de las personas que aparecen en tus fotografías. Los comentarios y fotografías pueden revisarse antes de publicarse, y podemos ocultar o retirar lo que incumpla estos términos o las normas de la comunidad.</p>`],
['Propiedad intelectual',`<p>El nombre, el logotipo, las ilustraciones, las tipografías, los textos y el diseño de la plataforma pertenecen a Aquí Somos Buena Música o a sus autores, y no pueden usarse sin autorización. La música, las imágenes y los materiales de cada artista pertenecen a sus titulares.</p>`],
['Enlaces y servicios externos',`<p>La web enlaza o incrusta servicios de terceros (plataformas de música y video, redes sociales, mapas y pasarela de pago). No controlamos esos servicios; su uso se rige por sus propias condiciones.</p>`],
['Disponibilidad y responsabilidad',`<p>Trabajamos para que la plataforma funcione bien, pero puede tener interrupciones por mantenimiento o fallos técnicos. Podemos cambiar o retirar funciones. En la medida en que la ley lo permita, no respondemos por daños derivados de interrupciones, de contenido publicado por otras personas o de servicios de terceros.</p>`],
['Cambios en estos términos',`<p>Podemos actualizar estos términos. Publicaremos la nueva versión con su fecha y, si el cambio es importante, te avisaremos por correo. Seguir usando la plataforma después del cambio implica aceptarlo.</p>`],
['Ley aplicable y contacto',`<p>Estos términos se rigen por las leyes de la República Dominicana. Cualquier controversia se someterá a los tribunales de Santo Domingo. Para dudas, escríbenos a ${PD('correo de contacto: por definir')} o usa el <a href="#p08">formulario de contacto</a>.</p>`]]},

condiciones:{t:'Términos y condiciones',intro:`<p>Estas condiciones se aplican a las boletas del festival, a la convocatoria para artistas y a las compras en la tienda. Complementan los <a href="#p09-terminos">términos de uso</a> y la <a href="#p09-privacidad">política de privacidad</a>.</p>`,secs:[
['Boletas',`<ul>
<li>La boleta es <b>gratuita</b> (RD$0) y se obtiene con una cuenta de asistente. Nunca se te pedirán datos de pago para obtenerla.</li>
<li>Hay <b>una boleta por persona</b>. Es personal e intransferible; está prohibido venderla. Las boletas obtenidas de forma fraudulenta o revendidas pueden anularse.</li>
<li>Las boletas dependen del aforo, que es limitado (${PD('aforo: por definir')}). Cuando se agoten, no se emitirán más.</li>
<li>Cada boleta es digital y tiene un código QR único. Preséntalo en la pantalla de tu teléfono al entrar; no se aceptan boletas impresas. Al validarla recibirás una pulsera de acceso y un sello para tu pasaporte musical. ${PD('Solicitud de documento de identidad: por definir')}</li>
<li>La boleta reserva tu cupo. ${PD('Política de acceso para personas sin boleta y hora límite de entrada: por definir')}</li>
<li>Si no puedes asistir, cancela tu boleta desde <b>Mi cuenta › Mis boletas</b> para liberar el cupo.</li>
<li>Al obtener tu boleta aceptas las <a href="#p09-evento">normas del evento</a>. El equipo puede negar el acceso o pedir que salga del recinto a quien las incumpla o ponga en riesgo la seguridad.</li></ul>`],
['Cambios en el festival',`<p>La fecha, el horario, el lugar y el cartel pueden cambiar por causas ajenas a la organización. Avisaremos de cualquier cambio en la web y por correo. Si el festival se aplaza, ${PD('validez de las boletas para la nueva fecha: por definir')}. Si se cancela, las boletas quedarán anuladas; al ser gratuitas, no generan reembolso.</p>`],
['Fotografía y grabación en el festival',`<p>El festival se fotografiará y grabará para su difusión. Al asistir aceptas aparecer en tomas generales del público. Si apareces en primer plano y no quieres que se publique esa imagen, escríbenos y la retiraremos.</p>`],
['Convocatoria para artistas',`<ul>
<li>Pueden postularse artistas y agrupaciones independientes y emergentes vinculados a la escena musical dominicana, que tengan música publicada, un video en vivo y disponibilidad en la fecha del festival.</li>
<li>Postularse es <b>gratuito</b>. Las fechas de apertura y cierre se publican en <a href="#ar01">Para artistas</a>. Puede haber un límite de solicitudes; al alcanzarlo, se abre una lista de espera.</li>
<li>Postularse <b>no garantiza la selección</b>. Un comité revisa cada solicitud. ${PD('Criterios de selección: se publicarán antes de abrir la convocatoria')}</li>
<li>Debes ser autor o autora del material que envías o tener permiso para usarlo. Eres responsable de los derechos sobre la música que presentes.</li>
<li>Si te seleccionan, deberás confirmar tu participación en el plazo indicado. Las condiciones de la presentación (horario, duración y montaje técnico) se acordarán aparte. ${PD('Beneficios, remuneración, transporte y alojamiento: por confirmar')}</li>
<li>Si lo autorizas en tu perfil, podremos usar tu nombre, fotografía, textos y fragmentos de tu música o de tu presentación para difundir el festival.</li>
<li>Puedes retirar tu postulación desde tu panel mientras no se haya publicado el resultado.</li></ul>`],
['Compras en la tienda',`<ul>
<li>Los productos son oficiales del festival y sus existencias son limitadas. Las imágenes son orientativas.</li>
<li>Los precios se muestran en pesos dominicanos (RD$). ${PD('Impuestos incluidos y costos de envío: por definir')}</li>
<li>El pedido se confirma cuando recibes el correo de confirmación ${PD('y, si aplica, cuando se aprueba el pago')}.</li>
<li><b>Pago:</b> ${PD('método: pasarela externa con tarjeta, o reserva y pago al recoger')}. No guardamos los datos completos de tu tarjeta.</li>
<li><b>Entrega:</b> ${PD('recogida en un punto por definir y/o envío a domicilio dentro de la República Dominicana; zonas, costos y plazos por definir')}.</li>
<li><b>Cancelación:</b> puedes cancelar tu pedido antes de que se prepare o envíe, escribiéndonos.</li>
<li><b>Cambios y devoluciones:</b> tienes ${PD('plazo: por definir')} días desde la entrega para pedir un cambio o devolución de productos sin usar y en su empaque. Si el producto llega defectuoso o no corresponde a tu pedido, lo cambiamos o te devolvemos el dinero. Esto no limita los derechos que te reconoce la Ley n.º 358-05 de Protección de los Derechos del Consumidor o Usuario.</li></ul>`],
['Ley aplicable y contacto',`<p>Estas condiciones se rigen por las leyes de la República Dominicana. Para dudas sobre boletas, postulaciones o pedidos, escríbenos a ${PD('correo de contacto: por definir')} o usa el <a href="#p08">formulario de contacto</a>.</p>`]]},

comunidad:{t:'Normas de la comunidad',intro:`<p>Los comentarios y la galería son un espacio para celebrar la música dominicana. Para que siga siendo un buen lugar:</p>`,secs:[
['Lo que esperamos',`<ul><li>Trata con respeto a artistas, público y equipo. No se permiten insultos, acoso ni discriminación de ningún tipo.</li><li>Sin spam, publicidad ni enlaces promocionales.</li><li>Publica solo fotografías propias o con permiso de su autor o autora.</li><li>No publiques fotografías de menores identificables sin el consentimiento de sus responsables.</li><li>No compartas datos personales tuyos ni de otras personas (teléfonos, direcciones, documentos).</li></ul>`],
['Moderación',`<p>Los comentarios y fotografías pueden revisarse antes de publicarse. El equipo puede ocultar o retirar contenido que incumpla estas normas y, si se repite, suspender la cuenta. Si ves algo inadecuado, avísanos desde el <a href="#p08">formulario de contacto</a>.</p>`]]},

evento:{t:'Normas del evento',intro:`<p>Queremos que el festival sea seguro y disfrutable para todo el mundo. Al obtener tu boleta aceptas estas normas.</p>`,secs:[
['Acceso',`<ul><li>Una boleta por persona; preséntala en la pantalla de tu teléfono.</li><li>${PD('Hora de apertura de puertas y hora límite de entrada: por definir')}</li><li>${PD('Acceso de menores y acompañamiento: por definir')}</li><li>El personal puede revisar bolsos por seguridad.</li></ul>`],
['Objetos no permitidos',`<p>${PD('Lista de objetos no permitidos: por definir junto con la administración de la Fortaleza Ozama')}</p>`],
['Convivencia y cuidado del lugar',`<ul><li>Respeta a artistas, público y personal.</li><li>La Fortaleza Ozama es patrimonio histórico: no subas a muros ni zonas restringidas y usa los zafacones.</li><li>Sigue las indicaciones del personal y de seguridad.</li><li>El equipo puede pedir que salga del recinto a quien ponga en riesgo a otras personas o al lugar.</li></ul>`]]}
};
function legalDoc(k){const d=LEGAL[k];return `<article class="legal"><header class="legal-h"><p class="tiny">Última actualización: ${PD('fecha de publicación')}</p></header>${d.intro}
 <nav class="legal-toc" aria-label="Contenido"><p class="eyebrow">Contenido</p><ol>${d.secs.map((s,i)=>`<li><a href="#p09-${k}" data-act="scroll" data-arg="lg-${i+1}">${s[0]}</a></li>`).join('')}</ol></nav>
 ${d.secs.map((s,i)=>`<section id="lg-${i+1}" class="legal-s"><h2><span class="lg-n">${i+1}</span>${s[0]}</h2>${s[1]}</section>`).join('')}</article>`}

def('p09',{m:'Sitio público',c:'P09',t:'Legales y normas',f:'F05 · F06 · F12',route:'p09-privacidad',n:['Pestañas: privacidad, términos de uso, términos y condiciones (boletas, convocatoria y tienda), normas de la comunidad y normas del evento.','Borrador redactado a partir del proyecto. Lo marcado entre corchetes está por definir. Debe revisarlo un abogado antes de publicarse.','Se enlaza desde los registros, la boleta, el pago de la tienda, la postulación y los formularios de comunidad.'],

 return `<div class="wrap">${crumbs([['p01','Inicio'],['','Legales']])}<div class="stack legal-page" style="padding-block:20px 72px;max-width:860px"><p class="eyebrow">Legales y normas</p><h1>${LEGAL[k].t}</h1><nav class="tabs" aria-label="Documentos legales">${Object.keys(LEGAL).map(x=>`<a href="#p09-${x}" class="${x===k?'on':''}"${x===k?' aria-current="page"':''}>${LEGAL[x].t}</a>`).join('')}</nav>
 ${legalDoc(k)}${pnote('Borrador sin revisión legal. Los datos entre corchetes están por definir. Antes de publicar debe revisarlo un abogado.')}</div></div>`}});

/* ===== CUENTAS Y ACCESO ===== */
def('s01',{m:'Cuentas y acceso',c:'S01',t:'Iniciar sesión',f:'F00 · F05 · F07',n:['Un solo inicio de sesión para todos los roles. Después redirige a la acción pendiente o, si no hay, según el rol: asistente → U01, artista → AR03, equipo → ADM01.','Si llega desde una acción protegida, muestra qué acción continuará.','Dos accesos de registro separados: asistentes (S02) y artistas (AR02).','Errores: credenciales incorrectas y bloqueo temporal tras varios intentos.','«Continuar con Google» (OAuth 2.0 / Google Identity Services): si el correo ya existe se vincula a esa cuenta; si no, se crea una cuenta de asistente. Solo se piden nombre, correo y foto. Error de Google: actívalo en Escenarios › error del servidor. En desarrollo, usar el botón oficial de Google para cumplir sus normas de marca.'],
 r(){if(loggedIn()){const p=S.pending;S.pending=null;return {redirect:p||homeFor()}}
 const pend=S.pending?(SCREENS[S.pending]||SCREENS[S.pending.split('-')[0]]):null;
 return `<div class="wrap"><div class="auth"><h1>Iniciar sesión</h1>
 ${pend?alertBox('info','Inicia sesión para continuar',`Después volverás a: <b>${pend.t}</b>.`):''}
 ${UI.loginErr==='cred'?alertBox('err','El correo o la contraseña no coinciden','Revisa los datos e inténtalo de nuevo.'):''}
 ${UI.loginErr==='lock'?alertBox('err','Acceso bloqueado temporalmente','Hubo demasiados intentos. Espera 15 minutos o recupera tu contraseña.',btn('Recuperar contraseña',{href:'s03',k:'sec',sm:1})):''}
 ${gBlock('asistente','Continuar con Google')}
 <form class="form" data-form="login" novalidate>${fsum()}${fld({id:'le',l:'Correo',t:'email',req:1,auto:'email',v:UI.loginEmail})}${fld({id:'lp',l:'Contraseña',t:'password',req:1,auto:'current-password'})}
 <a href="#s03" class="tiny" style="color:var(--verde);font-weight:700">¿Olvidaste tu contraseña?</a>${btn('Iniciar sesión',{type:'submit',block:1})}</form>
 ${S.pending?btn('Cancelar y volver',{act:'cancelAuth',k:'ter'}):''}
 <p class="or">¿No tienes cuenta?</p><div class="g g2" style="gap:12px">${btn('Crear cuenta de asistente',{href:'s02',k:'sec'})}${btn('Registrarme como artista',{href:'ar02',k:'sec'})}</div>
 ${pnote(`Cualquier correo y contraseña de 8+ caracteres entra como asistente. Usa un correo con «artista» o «equipo» para esos roles; con «error» verás credenciales incorrectas y con «bloqueo», el bloqueo.<div class="btnrow">${btn('Entrar como asistente',{act:'quick',arg:'asistente',k:'sec'})}${btn('Entrar como artista',{act:'quick',arg:'artista',k:'sec'})}${btn('Entrar como equipo',{act:'quick',arg:'equipo',k:'sec'})}</div>`)}</div></div>`}});
const GLOGO='<svg class="glogo" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
function gBlock(role,label){return `${UI.gErr?alertBox('err','No se pudo continuar con Google','Inténtalo de nuevo o usa tu correo y contraseña.'):''}<button type="button" class="gbtn" data-act="google" data-arg="${role}">${GLOGO}<span>${label||'Continuar con Google'}</span></button><p class="or-line"><span>o con tu correo</span></p>`}
function homeFor(){return {asistente:'u01',artista:'ar03',equipo:'adm01'}[S.role]||'p01'}

def('s02',{m:'Cuentas y acceso',c:'S02',t:'Registro de asistente',f:'F05',n:['Solo los datos estrictamente necesarios: nombre, correo, contraseña y aceptación de términos. Edad mínima: por definir (C6).','Enlace visible al registro de artistas para no mezclar recorridos.','Errores: campos, correo ya registrado (usa «existe@…»), fallo del servidor (Escenarios).','Al terminar inicia sesión y vuelve a la acción pendiente o a U01. La verificación de correo no bloquea la boleta en v1.','Registro con Google: crea la cuenta sin contraseña (el correo ya viene verificado por Google) y aplica la aceptación de términos indicada bajo el botón.'],
 r(){if(loggedIn())return {redirect:'u01'};
 return `<div class="wrap"><div class="auth"><p class="eyebrow">Asistentes</p><h1>Crea tu cuenta</h1><p class="muted">Para obtener tu boleta gratuita, comentar y seguir tus pedidos.</p>
 ${UI.s02err==='dup'?alertBox('err','Ya existe una cuenta con este correo','Inicia sesión o recupera tu contraseña.',btn('Iniciar sesión',{href:'s01',k:'sec',sm:1})+btn('Recuperar contraseña',{href:'s03',k:'ter',sm:1})):''}
 ${UI.s02err==='srv'?alertBox('err','No se pudo crear la cuenta','Ocurrió un problema en el servidor. Tus datos siguen en el formulario; inténtalo de nuevo.'):''}
 ${gBlock('asistente','Registrarme con Google')}<p class="tiny gnote">Al continuar con Google aceptas los <a href="#p09-terminos">términos de uso</a> y la <a href="#p09-privacidad">política de privacidad</a>.</p>
 <form class="form" data-form="reg" novalidate>${fsum()}${fld({id:'rn',l:'Nombre y apellido',req:1,auto:'name',v:UI.rn})}${fld({id:'re',l:'Correo',t:'email',req:1,auto:'email',v:UI.re})}${fld({id:'rp',l:'Contraseña',t:'password',req:1,min:8,auto:'new-password',help:'Al menos 8 caracteres.'})}
 ${fld({id:'rt',l:'Acepto los <a href="#p09-terminos">términos de uso</a> y la <a href="#p09-privacidad">política de privacidad</a>',t:'check',req:1})}${btn('Crear cuenta',{type:'submit',block:1})}</form>
 <p class="muted" style="text-align:center">¿Ya tienes cuenta? <a href="#s01">Inicia sesión</a></p>
 <div class="card pad stack sm"><b>¿Eres artista y quieres postularte?</b><p class="muted">El registro de artistas es distinto e incluye tu perfil artístico.</p>${btn('Ir al registro de artistas',{href:'ar02',k:'sec'})}</div>
 ${pnote('Usa un correo que empiece por «existe@» para ver el error de correo duplicado.')}</div></div>`}});

def('s03',{m:'Cuentas y acceso',c:'S03',t:'Recuperar contraseña',f:'F17',n:['Pide solo el correo. El mensaje de confirmación es neutro para no revelar qué correos están registrados.','Pantalla siguiente: S03 · Enlace enviado.'],
 r(){return `<div class="wrap"><div class="auth"><h1>Recupera tu contraseña</h1><p class="muted">Escribe tu correo y te enviaremos un enlace para crear una contraseña nueva.</p>
 <form class="form" data-form="recover" novalidate>${fsum()}${fld({id:'rce',l:'Correo',t:'email',req:1,auto:'email'})}${btn('Enviar enlace',{type:'submit',block:1})}</form><a href="#s01">Volver a iniciar sesión</a></div></div>`}});
def('s03-enviado',{m:'Cuentas y acceso',c:'S03',t:'Enlace enviado',f:'F17',n:['Mensaje neutro. «Reenviar» se habilita tras 60 segundos.','Alternativas: revisar spam o escribir a contacto (P08).','Usa la nota del prototipo para abrir el enlace válido o uno caducado.'],
 r(){if(!UI.resendAt)UI.resendAt=Date.now()+60000;
 return stateScreen({ic:'info',e:'Recuperar contraseña',t:'Revisa tu correo',b:'Si el correo está registrado, recibirás un enlace para crear una contraseña nueva. El enlace caduca en [60 minutos, por definir].',
 x:`<p class="muted">¿No llegó? Revisa la carpeta de spam.</p>`,a:`<button type="button" class="btn sec" data-until="${UI.resendAt}" data-act="resend" ${Date.now()<UI.resendAt?'disabled':''}>Reenviar enlace</button>${btn('Escribir a contacto',{href:'p08',k:'ter'})}`})+`<div class="wrap" style="max-width:620px;padding-bottom:48px">${pnote(`Simula lo que pasa al abrir el correo.<div class="btnrow">${btn('Abrir enlace válido',{href:'s04',k:'sec'})}${btn('Abrir enlace caducado',{href:'s04-caducado',k:'sec'})}</div>`)}</div>`}});
def('s04',{m:'Cuentas y acceso',c:'S04',t:'Nueva contraseña',f:'F17',n:['Pide la contraseña nueva y su confirmación, con requisitos visibles.','Al guardar: cierra otras sesiones, inicia sesión y vuelve a la acción pendiente o al inicio según el rol.'],

def('s04-caducado',{m:'Cuentas y acceso',c:'S04',t:'Enlace caducado',f:'F17',n:['Estado de error cuando el enlace caducó o ya se usó. Lleva a pedir uno nuevo.'],

def('b01',{m:'Boletas',c:'B01',t:'Confirmar boleta',f:'F06',
 req:()=>(S.insc==='abierta'&&!['finalizado','pospuesto'].includes(S.fest))?'cuenta':null,
 n:['Antes de pedir sesión comprueba si la inscripción está abierta (F06). Estados: aún no abierta, cerrada, pospuesto, aforo completo, ya tiene boleta, error al emitir.','No pide datos nuevos: nombre y correo vienen de la cuenta.','«Gratis · RD$0» y «No se te pedirá ningún pago» visibles. Sin campos de pago.','Una boleta por cuenta y festival: si ya existe, redirige a B03.'],

 if(S.fest==='finalizado'||S.insc==='cerrada')return stateScreen({ic:'info',e:'Boletas',t:'La inscripción de boletas está cerrada',b:S.fest==='finalizado'?'El festival ya terminó. Te esperamos en la próxima.':'Ya no se emiten boletas para esta edición.',a:btn('Ver información del festival',{href:'p03',k:'sec'})});
 if(S.fest==='pospuesto')return stateScreen({ic:'alert',e:'Boletas',t:'Boletas en pausa',b:'El festival se pospuso. Te avisaremos cuando haya nueva fecha.',a:btn('Ver comunicado',{href:'p03',k:'sec'})});
 if(S.insc==='no-abierta')return stateScreen({ic:'clock',e:'Boletas',t:'La inscripción aún no está abierta',b:'Se abrirá el [fecha por anunciar]. Puedes pedir que te avisemos.',a:btn('Avísame cuando abra',{act:'avisame'})+btn('Ver el festival',{href:'p03',k:'sec'})});
 if(S.boleta&&S.boleta.st==='activa'){UI.flash={k:'info',t:'Ya tienes una boleta para este festival. No es necesario obtener otra.'};return {redirect:'b03'}}
 if(S.aforo==='completo')return stateScreen({ic:'alert',e:'Boletas',t:'Aforo completo',b:'Ya no quedan boletas disponibles para el festival.',a:btn('Avisarme si se libera un cupo',{act:'avisame'})+btn('Ver el festival',{href:'p03',k:'sec'}),x:`<p class="tiny">Aviso por correo: Fase 2. Las boletas canceladas liberan cupos.</p>`});
 return `<div class="wrap">${crumbs([['p03','El festival'],['','Obtener boleta']])}<div class="stack" style="padding-block:20px 8px"><h1>Confirma tu boleta</h1></div>
 <div class="co" style="padding-top:12px"><form class="form" data-form="boleta" novalidate>${UI.b01err?alertBox('err','No pudimos emitir tu boleta','No se reservó ningún cupo. Inténtalo de nuevo en unos segundos.'):''}${fsum()}
 <fieldset class="box"><legend>Tus datos</legend><dl class="kv"><dt>Nombre</dt><dd>${esc(S.name)}</dd><dt>Correo</dt><dd>${esc(S.email)}</dd></dl><p class="tiny">¿No eres tú? <a href="#s01" data-act="switchAcct">Cambiar de cuenta</a></p></fieldset>
 ${alertBox('info','Una boleta por persona','Cada asistente obtiene la suya con su propia cuenta.')}
 ${fld({id:'bn',l:'Acepto las <a href="#p09-evento">normas del evento</a>',t:'check',req:1})}
 ${btn('Confirmar mi boleta · Gratis',{type:'submit',block:1})}</form>
 <aside class="card pad stack"><p class="eyebrow">Resumen</p><h3>Festival 2026</h3><dl class="kv"><dt>Fecha</dt><dd>${fechaTxt()}</dd><dt>Lugar</dt><dd>${lugarTxt()}</dd><dt>Cantidad</dt><dd>1 boleta</dd></dl><hr class="sep"><div class="sumline tot"><span>Total</span><span>Gratis · RD$0</span></div><p class="tiny">No se te pedirá ningún pago.</p></aside></div></div>`}});

def('b02',{m:'Boletas',c:'B02',t:'Boleta lista',f:'F06',n:['Confirmación con el código de la boleta y tres salidas: ver boleta, información para asistir, seguir explorando.','Se envía una copia por correo (simulado).','Aclara la diferencia entre boleta (asistencia prevista) y registro en el acceso (asistencia real).'],
 r(){if(!S.boleta)return {redirect:'b01'};
 return stateScreen({ic:'ok',e:'Boleta confirmada',t:'Tu boleta está lista',b:`Código <b class="code" style="font-size:18px">${S.boleta.code}</b>. Te enviamos una copia a ${esc(S.email)}.`,
 x:`<p class="tiny">Tu boleta reserva tu cupo. Tu asistencia se registra cuando la escaneen en el acceso.</p>`,
 a:btn('Ver mi boleta',{href:'b03'})+btn('Información para asistir',{href:'p03',k:'sec'})+btn('Seguir explorando',{href:'p01',k:'ter'})+btn('Añadir al calendario · Fase 2',{dis:1,sm:1})})}});

def('b03',{m:'Boletas',c:'B03',t:'Ver boleta',f:'F06 · F19',req:'cuenta',n:['Muestra nombre, festival, fecha, lugar, código QR y alfanumérico, y estado (activa, usada, cancelada).','«Ya no podré asistir» pide confirmación en la misma pantalla y libera el cupo.','En móvil el QR pasa arriba y ocupa el ancho para leerlo en el acceso.'],
 r(){if(!S.boleta)return stateScreen({ic:'ticket',e:'Mis boletas',t:'Aún no tienes boletas',b:'Obtén tu boleta gratuita para el festival.',a:boletaCTA()});
 const b=S.boleta;const st={activa:chip('Activa','solid'),cancelada:chip('Cancelada','dash'),usada:chip('Usada · acceso registrado '+(b.usedAt?fmtT(b.usedAt):''))}[b.st];
 return `<div class="wrap">${crumbs([['u01','Mi cuenta'],['u03','Mis boletas'],['','Boleta']])}<div class="stack lg" style="padding-block:20px 72px;max-width:860px"><h1>Tu boleta</h1>
 <div class="ticket"><div class="tl t-verde">${ic('sol','bg')}<p class="eyebrow">Boleta</p><h2>Aquí Somos Buena Música</h2><div>${st} ${chip('Gratis · RD$0')}</div><dl class="kv"><dt>Nombre</dt><dd>${esc(b.name)}</dd><dt>Fecha</dt><dd>${fechaTxt()}</dd><dt>Lugar</dt><dd>${lugarTxt()}</dd><dt>Emitida</dt><dd>${fmtDs(b.at)}</dd></dl></div>
 <div class="tr"><div style="width:180px${b.st==='cancelada'?';opacity:.45':''}">${ph(b.st==='cancelada'?'Código anulado':'Código QR','1/1')}</div><span class="code">${b.code}</span><span class="tiny">Muestra este código en el acceso</span></div></div>

 let body;

 else body=`${cat==='todos'?`<a class="feat" href="#c02-1">${coverArt({...POSTS[0],href:'c02-1'},'16/9',1)}<div class="stack sm"><span>${chip('Destacado','solid')} ${chip(CATS.festival)}</span><h2>${POSTS[0].t}</h2><p class="muted">${POSTS[0].x}</p><span class="lnk">Leer artículo →</span></div></a><hr class="sep" style="margin:32px 0">`:''}

function comments(key,route){const list=(S.comments[key]||[]).filter(c=>c.st!=='rechazado'&&(c.st==='publicado'||c.own));

 if(S.comm==='cerrados')return `<section class="stack" style="max-width:820px;padding-top:24px" aria-labelledby="com-h">${head}${alertBox('info','Los comentarios están cerrados en este artículo','')}</section>`;

 const items=list.length?`<div class="stack lg">${list.map(c=>`<div class="comment"><div class="av" aria-hidden="true">${ic('sol')}</div><div class="stack sm"><div class="cmeta"><b>${esc(c.au)}</b><span class="tiny">${c.at}</span>${c.st==='revision'?chip('En revisión · solo tú lo ves','dash'):''}${c.own&&c.st==='publicado'?chip('Publicado'):''}</div><p>${esc(c.tx)}</p>
 <div class="cacts">${c.own?(UI.delC===c.id?`<span class="tiny">¿Eliminar tu comentario?</span>${btn('Eliminar',{act:'delComment',arg:key+'|'+c.id,k:'sec',sm:1})}${btn('Cancelar',{act:'ui',arg:'delC:0',k:'ter',sm:1})}`:btn('Eliminar',{act:'ui',arg:'delC:'+c.id,k:'ter',sm:1})):
 (UI.repDone===c.id?`<span class="tiny">Gracias. El equipo lo revisará.</span>`:UI.rep===c.id?`<label class="sr" for="rm${c.id}">Motivo</label><select id="rm${c.id}" style="min-height:36px"><option>Spam</option><option>Ofensivo</option><option>Otro</option></select>${btn('Enviar reporte',{act:'report',arg:key+'|'+c.id,k:'sec',sm:1})}`:btn('Reportar',{act:loggedIn()?'ui':'gate',arg:loggedIn()?'rep:'+c.id:route,k:'ter',sm:1}))}</div></div></div>`).join('')}</div>`:emptyBox('Aún no hay comentarios','Sé la primera persona en comentar.');
 return `<section class="stack lg" style="max-width:820px;padding-top:24px" id="comentarios" aria-labelledby="com-h">${head}${form}${UI.comOk?alertBox(UI.comOk==='revision'?'warn':'ok',UI.comOk==='revision'?'Tu comentario está en revisión':'Comentario publicado',UI.comOk==='revision'?'El filtro automático lo marcó. Solo tú lo ves hasta que el equipo lo apruebe.':''):''}${items}${pnote('Escribe «spam» o un enlace (http) para ver el estado En revisión. Activa «Simular error» en Escenarios para ver el fallo de envío.')}</section>`}

  else if(v&&el.type==='email'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))m='Escribe un correo válido, por ejemplo nombre@correo.com';
  else if(v&&el.type==='url'&&!/^https?:\/\/\S+\.\S+/.test(v))m='Escribe un enlace completo que empiece por https://';

  else if(v&&el.dataset.max&&v.length>+el.dataset.max)m=`Máximo ${el.dataset.max} caracteres`;
  else if(el.dataset.match&&v!==((f.querySelector('#'+el.dataset.match)||{}).value||'').trim())m='Las contraseñas no coinciden';
  if(m)mark(el,m)});

 modPhoto(arg,el){const [id,d]=arg.split('|');const p=S.photos.find(x=>x.id===+id);const card=el&&el.closest('.card');const sel=card?card.querySelector('.mot'):null;if(d==='ok'){p.st='aprobada'}else{p.st='rechazada';p.mot=sel?sel.value:'Contenido inapropiado'}if(p.own)notif(d==='ok'?'Tu foto fue aprobada y ya está en la galería.':'Tu foto no se publicó. Motivo: '+p.mot,'u05');save();render()},
 modCom(arg){const [k,id,d]=arg.split('|');const c=(S.comments[k]||[]).find(x=>x.id===+id);c.st=d==='ok'?'publicado':'rechazado';if(c.own)notif(d==='ok'?'Tu comentario fue aprobado.':'Tu comentario no se publicó.','u05');save();render()},
 clearRep(i){S.reports.splice(+i,1);save();render()},
 delPhoto(id){S.photos=S.photos.filter(x=>x.id!==+id);save();render()},
 fillCode(c){UI.acode=c;UI.acc=null;render()},
 back(){history.back()},
 reset(){try{localStorage.removeItem('asbm-hifi-v2')}catch(e){}S=SEED();UI={};save();go('p01');drawScn()}
};
const CHG={
 sel(v,el){const pid=+el.dataset.pid;UI.sel=UI.sel||{};UI.sel[pid]=UI.sel[pid]||{};UI.sel[pid][el.name]=v;UI.addErr=null;UI.refocus=el.id;render()},
 ent(v){UI.ent=v;render()},
 met(v){UI.met=v;render()},
 nst(v){UI.nst=v;UI.admConf=null;render()},
 files(v,el){const fs=[...el.files].slice(0,10).map(f=>({n:f.name,s:f.size,e:!/^image\/(jpeg|png)$/.test(f.type)?'Formato no admitido. Usa JPG o PNG.':f.size>10*1048576?'La foto supera 10 MB.':null}));UI.files=(UI.files||[]).concat(fs).slice(0,10);UI.upErr=null;render()},
 foto(v,el){const f=el.files[0];if(!f)return;if(!/^image\/(jpeg|png)$/.test(f.type))UI.fotoErr=`El archivo «${f.name}» no es una imagen JPG o PNG.`;else if(f.size>5*1048576)UI.fotoErr='La foto supera 5 MB. Reduce su tamaño.';else{UI.fotoErr=null;S.prof.foto=f.name;save()}render()},
 pref(v,el){S.prefs[el.name]=el.checked;save();toast('Preferencias guardadas')},
 commToggle(v,el){S.comm=el.checked?'activos':'cerrados';save();toast('Comentarios '+(el.checked?'activados':'desactivados'))},
 shopToggle(v,el){S.tienda=el.checked?'activa':'inactiva';save();render()},
 ordSt(v,el){const o=S.orders.find(x=>x.id===+el.dataset.oid);o.st=+v;notif('Tu pedido '+o.id+' cambió a: '+ORD_ST[o.st],'t08-'+o.id);save();toast('Estado del pedido actualizado. Se notificó al comprador.')}
};
function saveDraft(f){const fd=new FormData(f);for(const [k,v] of fd.entries())S.draft[k]=v}
function profFromForm(f){const fd=new FormData(f);const p=S.prof;['nombre','tipo','integrantes','provincia','desc','trayectoria','musica','video','redes','tel'].forEach(k=>{if(fd.has(k))p[k]=fd.get(k)});p.generos=fd.getAll('generos');p.autoriza=fd.get('autoriza')?'on':''}
const FORMS={
 contact(f){if(takeErr()){UI.p08err=1;render();return}UI.p08err=0;UI.p08ok=1;render()},
 login(f,d){const e=d.le.toLowerCase();UI.loginEmail=d.le;if(e.includes('bloqueo')){UI.loginErr='lock';render();return}if(e.includes('error')||d.lp.length<8){UI.loginErr='cred';render();return}
  const role=e.includes('equipo')?'equipo':e.includes('artista')?'artista':'asistente';loginAs(role,d.le,nameFromEmail(d.le))},
 reg(f,d){UI.rn=d.rn;UI.re=d.re;if(d.re.toLowerCase().startsWith('existe@')){UI.s02err='dup';render();return}if(takeErr()){UI.s02err='srv';render();return}
  S.unverified=true;notif('Bienvenida a Aquí Somos Buena Música. Verifica tu correo.','u01');const p=S.pending;S.role='asistente';S.name=d.rn;S.email=d.re;S.pending=null;UI={flash:{k:'ok',t:'Tu cuenta está lista. Te enviamos un correo para verificar tu dirección.'}};save();go(p||'u01')},
 recover(){UI.resendAt=null;go('s03-enviado')},
 newpass(){const p=S.pending;if(!loggedIn()){S.role='asistente';S.name=S.name||'Asistente';S.email=S.email||'maria@ejemplo.com'}S.pending=null;UI={flash:{k:'ok',t:'Contraseña actualizada. Cerramos tus otras sesiones.'}};save();go(p||homeFor())},
 boleta(){if(takeErr()){UI.b01err=1;render();return}UI.b01err=0;const code='ASBM-'+Math.random().toString(36).slice(2,6).toUpperCase();S.boleta={code,st:'activa',at:Date.now(),name:S.name};notif('Tu boleta '+code+' está lista.','b03');save();go('b02')},
 comment(f,d){const key=f.dataset.key;UI.comDraft=d.cx;if(takeErr()){UI.comErr=1;UI.comOk=null;render();return}
  const flag=/spam|https?:\/\//i.test(d.cx);S.comments[key]=S.comments[key]||[];S.comments[key].unshift({id:Date.now(),au:S.name,tx:d.cx,st:flag?'revision':'publicado',own:true,at:'Ahora'});S.firstComment=false;UI.comErr=0;UI.comDraft='';UI.comOk=flag?'revision':'ok';save();render()},
 upload(f,d){const files=UI.files||[];UI.upCap=d.upc;if(!files.length){UI.upErr='Selecciona al menos una foto.';render();return}if(files.some(x=>x.e)){UI.upErr='Quita los archivos con problemas antes de enviar.';render();return}
  if(takeErr()){UI.upErr='No se pudo subir una de las fotos. Puedes reintentar el envío.';render();return}
  UI.upErr=null;UI.upProg=0;render();const tick=()=>{UI.upProg=Math.min(100,UI.upProg+25);if(UI.upProg<100){render();setTimeout(tick,350)}else{files.forEach((x,i)=>S.photos.push({id:Date.now()+i,au:S.name,st:'revision',own:true,cap:d.upc||''}));UI.upProg=null;UI.files=[];UI.upCap='';save();go('c06-ok')}};setTimeout(tick,350)},
 co1(f,d){Object.assign(S.checkout,d);save();go('t05')},
 co2(f,d){Object.assign(S.checkout,d);if(d.ent!=='Envío a domicilio'){delete S.checkout.dd}save();go('t06')},
 pay(f,d){S.checkout.met=d.met;UI.payErr=null;
  if(S.stockCambio==='si'){S.stockCambio='no';UI.payErr='stock';save();render();return}
  if(d.met!=='Pagar al recoger'){if(S.pago==='rechazado'){UI.payErr='rech';render();return}if(S.pago==='abandonado'){go('t06-incompleta');return}}
  const o={id:1042+S.orders.length,items:S.cart.map(x=>({...x})),tot:cartTotal(),ent:S.checkout.ent,met:d.met==='Pagar al recoger'?'Pagar al recoger':'Pasarela externa (simulada)',st:1,at:Date.now(),guest:!loggedIn(),buyer:S.checkout.kn,mail:S.checkout.ke};
  S.orders.unshift(o);S.cart=[];S.checkout={};UI.justOrdered=1;notif('Pedido '+o.id+' confirmado.','t08-'+o.id);save();go('t07')},
 areg(f,d){UI.an=d.an;UI.at=d.at;UI.ac=d.ac;UI.ae=d.ae;if(d.ae.toLowerCase().startsWith('existe@')){UI.ar2err='dup';render();return}if(takeErr()){UI.ar2err='srv';render();return}
  S.role='artista';S.name=d.ac;S.email=d.ae;S.prof={nombre:d.an,tipo:d.at};S.unverified=true;notif('Tu cuenta de artista está lista. Completa tu perfil.','ar04');UI={welcome:1};save();go('ar04')},
 prof(f){profFromForm(f);if(!S.prof.foto){UI.fotoErr='Sube una foto principal.';save();render();return}if(takeErr()){UI.p4err=1;UI.p4ok=0;save();render();return}UI.p4err=0;UI.fotoErr=null;UI.p4ok=profOK()?1:0;save();render();if(!UI.p4ok)toast('Perfil guardado')},
 ar5(f){const n=+f.dataset.step;saveDraft(f);if(S.app==='ninguna')setApp('borrador',1);save();
  if(n<4){go('ar05-'+(n+1));return}
  if(S.draft.eleg==='No'){go('ar05-noelegible');return}
  if(takeErr()){UI.a5err=1;render();return}UI.a5err=0;
  if(S.conv==='limite'&&!S.waitOffer){toast('La convocatoria alcanzó su límite mientras completabas la solicitud.');go('ar08');return}
  S.waitOffer=false;setApp('enviada');save();go('ar06')},
 info(){setApp('en-revision');save();toast('Respuesta enviada. Tu solicitud vuelve a revisión.');render()},
 u2(f,d){const changed=d.ue!==S.email;S.name=d.un;UI.u2ok=changed?'Te enviamos un enlace de verificación a '+d.ue+'. Tu correo actual sigue activo hasta que confirmes.':'Datos actualizados.';save();render()},
 u7(f){UI.u7ok='Contraseña actualizada.';render()},
 delacc(f,d){if(d.dce!==S.email){const box=f.querySelector('.fld');box.classList.add('bad');const er=box.querySelector('.ferr');er.hidden=false;er.querySelector('span').textContent='El correo no coincide con el de tu cuenta';return}
  if(S.boleta&&S.boleta.st==='activa')S.boleta.st='cancelada';const keep=SEED();keep.fest=S.fest;keep.festAt=S.festAt;S=keep;UI={flash:{k:'info',t:'Tu cuenta se eliminó.'}};save();go('p01')},
 adm2(f,d){S.fest=d.xf;S.festAt=Date.now();S.loc=d.xl;S.insc=d.xi;S.conv=d.xc;save();toast('Cambios publicados: P03, P04, contador y botones actualizados.',`<a href="#p03">Ver en el sitio</a>`);render()},
 adm3(f,d){const id=f.dataset.id;if(d.nst==='requiere-info'&&!d.nmsg.trim()){UI.admConf=null;render();toast('Escribe qué información falta en el mensaje al artista.');return}
  if(id==='demo')setApp(d.nst);else S.admApps[id]=d.nst;UI.admConf=null;UI.nst=null;save();toast('Estado actualizado y artista notificado.');go('adm03')},
 acc(f,d){const c=d.acode.trim().toUpperCase();const b=S.boleta;UI.acode=c;
  if(c==='SIN-RED')UI.acc='off';else if(b&&c===b.code){if(b.st==='activa'){b.st='usada';b.usedAt=Date.now();UI.acc='ok'}else if(b.st==='usada')UI.acc='used';else UI.acc='bad'}else UI.acc='bad';save();render()}
};

/* ---------------- Eventos ---------------- */
function boot(){
 document.addEventListener('click',e=>{
  const p=e.target.closest('[data-pact]');if(p){const a=p.dataset.pact;
   if(a==='idx'||a==='scn'){const el=document.getElementById(a);const open=el.hidden;['idx','scn'].forEach(x=>{document.getElementById(x).hidden=true;document.getElementById('b-'+x).setAttribute('aria-expanded','false')});if(open){el.hidden=false;document.getElementById('b-'+a).setAttribute('aria-expanded','true');a==='idx'?drawIdx():drawScn()}}
   if(a==='notes'){const np=document.getElementById('notes');S.notesOpen=np.hidden;save();render()}
   if(a==='dev'){S.device=p.dataset.v;save();render();if(S.device==='mob')playIntro()}
   return}
  const ix=e.target.closest('#idx a.ix');if(ix&&!ix.target){document.getElementById('idx').hidden=true;document.getElementById('b-idx').setAttribute('aria-expanded','false')}
  const a=e.target.closest('[data-act]');if(a&&!a.disabled){if(a.tagName==='A'||a.type!=='submit')e.preventDefault();if(a.type==='submit'&&a.closest('form'))return;const fn=ACT[a.dataset.act];if(fn)fn(a.dataset.arg,a,e)}
  if(UI.menu&&e.target.closest('.mpanel a')){UI.menu=false}
  const det=document.querySelector('details.acct[open]');if(det&&!e.target.closest('details.acct'))det.open=false});
 document.addEventListener('change',e=>{const s=e.target.closest('[data-scn]');if(s){setScn(s.dataset.scn,s.value);return}const c=e.target.closest('[data-chg]');if(c&&CHG[c.dataset.chg])CHG[c.dataset.chg](c.value,c,e)});
 document.addEventListener('input',e=>{const el=e.target;if(el.dataset.count){const c=document.getElementById(el.id+'-cnt');if(c)c.textContent=el.value.length+' / '+el.dataset.count}
  if(el.dataset.save==='prof'){const f=el.closest('form');clearTimeout(window.__as);window.__as=setTimeout(()=>{profFromForm(f);save();UI.saved=fmtT(Date.now());const s=document.getElementById('autosave');if(s)s.textContent='Borrador guardado · '+UI.saved},800)}});
 document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();if(!validate(f))return;const fd=new FormData(f);const d={};for(const [k,v] of fd.entries())d[k]=v;FORMS[f.dataset.form](f,d)});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){['idx','scn'].forEach(x=>{document.getElementById(x).hidden=true;document.getElementById('b-'+x).setAttribute('aria-expanded','false')});if(UI.menu){UI.menu=false;render()}}});
 window.addEventListener('hashchange',()=>{UI.menu=false;['loginErr','s02err','ar2err','b01err','comOk','comErr','addErr','payErr','coChoice','conf','cancelB','delC','rep','p4ok','p4err','u2ok','u7ok','admConf','nst','acc','upErr','fotoErr','p08ok','p08err','moreErr','delAcc','a5err'].forEach(k=>delete UI[k]);render()});
 setInterval(()=>{document.querySelectorAll('[data-cd]').forEach(el=>{const t=+el.dataset.cd;if(t<=Date.now()&&['proximo','cero','definida'].includes(S.fest)){S.fest='en-curso';S.festAt=Date.now()+2*36e5;save();render()}else tickCd(el,t)});
  document.querySelectorAll('[data-until]').forEach(el=>{el.disabled=Date.now()<+el.dataset.until;const s=Math.ceil((+el.dataset.until-Date.now())/1000);el.textContent=s>0?`Reenviar enlace (${s} s)`:'Reenviar enlace'})},1000);
 render();if(isMob())playIntro()}
if(typeof document!=='undefined'&&document.getElementById('site'))boot();
</script>
