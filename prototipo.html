/* Somos Buena Música · v2 orgánica.
   Dominantes: crema + naranja y los dos azules (verde profundo, verde agua). Acentos: rojo y negro.
   Títulos: Buena Música (solo mayúsculas). Texto: SBM Marea. Formas orgánicas, ondas entre bandas,
   animación solo con transform/opacity; content-visibility para no pintar fuera de pantalla. */
:root{
  --verde:#003B3A; --agua:#419D99; --crema:#F6E3CD; --naranja:#E29312; --rojo:#BC231E; --negro:#1D1D1B;
  --surf:#FFF9F0; --crema2:#EFD5B6; --tinta2:#2F5C5A; --crema-mut:#D9CBB5;
  --fd:"Buena Musica","Arial Rounded MT Bold",system-ui,sans-serif;
  --fde:"Buena Musica Espiral","Buena Musica","Arial Rounded MT Bold",sans-serif;
  --ft:"SBM Marea",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --pbh:48px; --top:calc(var(--pbh) + env(safe-area-inset-top,0px));
  --r:16px; --rl:28px; --hh:80px;
  --org:42% 58% 52% 48% / 46% 44% 56% 54%;
  --orgc:30px 40px 26px 44px / 40px 28px 44px 30px;
  --bg:var(--crema); --fg:var(--verde); --mut:var(--tinta2); --hlbg:var(--naranja); --hlfg:var(--verde); --i:var(--agua);
  --pb:var(--verde); --pf:var(--crema); --line:rgba(0,59,58,.22); --sh:var(--naranja);
  color-scheme:light;
}
.t-crema{--bg:var(--crema);--fg:var(--verde);--mut:var(--tinta2);--hlbg:var(--naranja);--hlfg:var(--verde);--i:var(--agua);--pb:var(--verde);--pf:var(--crema);--line:rgba(0,59,58,.22);--sh:var(--naranja)}
.t-naranja{--bg:var(--naranja);--fg:var(--verde);--mut:var(--verde);--hlbg:var(--crema);--hlfg:var(--verde);--i:var(--verde);--pb:var(--verde);--pf:var(--crema);--line:rgba(0,59,58,.3);--sh:var(--crema)}
.t-verde{--bg:var(--verde);--fg:var(--crema);--mut:var(--crema-mut);--hlbg:var(--naranja);--hlfg:var(--verde);--i:var(--agua);--pb:var(--naranja);--pf:var(--verde);--line:rgba(246,227,205,.28);--sh:var(--agua)}
.t-agua{--bg:var(--agua);--fg:var(--verde);--mut:var(--verde);--hlbg:var(--crema);--hlfg:var(--verde);--i:var(--crema);--pb:var(--verde);--pf:var(--crema);--line:rgba(0,59,58,.3);--sh:var(--verde)}
.t-rojo{--bg:var(--rojo);--fg:var(--crema);--mut:var(--crema);--hlbg:var(--crema);--hlfg:var(--rojo);--i:var(--naranja);--pb:var(--crema);--pf:var(--rojo);--line:rgba(246,227,205,.35);--sh:var(--verde)}
.t-crema,.t-naranja,.t-verde,.t-agua,.t-rojo{background:var(--bg);color:var(--fg)}
.card,.al,.surface,.auth,.tblw,.list,.empty,.drop,.pnote{--bg:var(--surf);--fg:var(--verde);--mut:var(--tinta2);--hlbg:var(--naranja);--hlfg:var(--verde);--i:var(--agua);--pb:var(--verde);--pf:var(--crema);--line:rgba(0,59,58,.18);--sh:var(--naranja)}

/* Barras de desplazamiento ocultas (el desplazamiento sigue funcionando) */
html,body,*{scrollbar-width:none}
*::-webkit-scrollbar{width:0;height:0;display:none}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:#2a2a28;color:var(--verde)}
body{font-family:var(--ft);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"kern"}
h1,h2,h3,h4{margin:0;line-height:1;text-wrap:balance;font-family:var(--fd);font-weight:700;text-transform:uppercase;letter-spacing:.01em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--fg);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:20px;height:20px;flex:0 0 auto}
.ill{fill:currentColor;display:block}

/* ---------- Barra del prototipo (herramienta, neutra) ---------- */
.proto{position:fixed;inset:0 0 auto;z-index:60;background:#1D1D1B;color:#f2f2f2;padding-top:env(safe-area-inset-top,0px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.proto .in{height:var(--pbh);display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:12px}
.pbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid #555;background:transparent;color:#f2f2f2;border-radius:3px;cursor:pointer;font-family:var(--fm);font-size:12px;white-space:nowrap}
.pbtn:hover{background:#333}
.pbtn[aria-pressed="true"],.pbtn[aria-expanded="true"]{background:#f2f2f2;color:#111;border-color:#f2f2f2}
.pcur{display:flex;align-items:baseline;gap:8px;min-width:0;overflow:hidden}
.pcode{background:#f2f2f2;color:#111;padding:2px 6px;font-weight:500;flex:0 0 auto}
.ptitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ddd}
.pflow{color:#9a9a9a;white-space:nowrap}
.pspace{flex:1}
.pseg{display:inline-flex;border:1px solid #555;border-radius:3px;overflow:hidden}
.pseg button{border:0;border-radius:0;height:30px}
.ptag{color:#9a9a9a;white-space:nowrap}
@media (max-width:900px){.pflow,.ptag,.plab{display:none}}
@media (max-width:560px){.ptitle{display:none}}
.drawer{position:fixed;top:var(--top);bottom:0;z-index:55;width:min(360px,92vw);background:#fff;color:#1D1D1B;border:1px solid #ccc;overflow:auto;padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 0 0 100vmax rgba(0,0,0,.3);font-family:var(--ft)}
.drawer.left{left:0;padding-left:max(18px,env(safe-area-inset-left,0px))}
.drawer.right{right:0;padding-right:max(18px,env(safe-area-inset-right,0px))}
.drawer h2{font-size:16px;margin-bottom:4px;font-family:var(--ft);text-transform:none}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.drawer .grp{font-family:var(--fm);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#666;margin:16px 0 4px}
.drawer a.ix{display:flex;gap:8px;padding:5px 6px;text-decoration:none;font-size:14px;border-radius:3px;color:#1D1D1B}
.drawer a.ix:hover{background:#f2f2f2}
.drawer a.ix.on{background:#1D1D1B;color:#fff}
.drawer a.ix code{font-family:var(--fm);font-size:11.5px;min-width:52px;color:inherit;opacity:.7;padding-top:2px}
.drawer .btn,.notes-p .btn{font-family:var(--ft);text-transform:none;color:#1D1D1B;border-radius:4px}
.scn-row{display:grid;gap:4px;margin:10px 0}
.scn-row label{font-size:13px;font-weight:700}
.scn-row select{min-height:38px;border:1.5px solid #777;border-radius:3px;padding:0 8px;background:#fff}
.notes-p{position:fixed;top:var(--top);right:0;bottom:0;width:330px;z-index:40;background:#fff;color:#1D1D1B;border-left:1px solid #ccc;overflow:auto;padding:16px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;font-size:14px}
.notes-p h2{font-size:17px;margin:6px 0 2px;font-family:var(--ft);text-transform:none}
.notes-p .nf{font-family:var(--fm);font-size:12px;color:#666}
.notes-p ul{padding-left:18px;margin:10px 0}
.notes-p li{margin:6px 0}
.notes-p .nh{font-family:var(--fm);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#666;margin-top:16px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.swatches span{display:grid;gap:2px;font-family:var(--fm);font-size:10.5px}
.swatches i{display:block;height:26px;border-radius:6px;border:1px solid #ccc}
@media (max-width:1100px){.notes-p{box-shadow:0 0 0 100vmax rgba(0,0,0,.3);width:min(340px,92vw)}}

/* ---------- Escenario ---------- */
.stage{padding-top:var(--top);min-height:100vh}
@media (min-width:1101px){.stage.withnotes{padding-right:330px}}
.site{background:var(--crema);color:var(--verde);container:site / inline-size;min-height:calc(100vh - var(--top));overflow-x:clip}
.stage.mob{padding-bottom:40px}
.stage.mob .site{width:390px;max-width:calc(100% - 32px);margin:20px auto 0;border-radius:28px;min-height:844px;box-shadow:0 0 0 10px #111}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
@container site (max-width:760px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
main.enter{animation:pagein .55s cubic-bezier(.2,.9,.25,1)}
@keyframes pagein{from{transform:translateY(18px)}to{transform:none}}

/* ---------- Tipografía ---------- */
.site h1{font-size:62px}
.site h2{font-size:46px}
.site h3{font-size:22px;letter-spacing:.02em}
.site h4{font-size:16px}
.lead{font-size:20.5px;color:var(--mut);max-width:58ch;line-height:1.5}
.lead.sm{font-size:18.5px}
.muted{color:var(--mut)}
.tiny{font-size:14px;color:var(--mut)}
.eyebrow{display:inline-flex;align-items:center;gap:6px;align-self:start;justify-self:start;width:fit-content;max-width:100%;font-family:var(--ft);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border:2.5px solid currentColor;border-radius:999px;padding:4px 14px 3px;color:var(--fg);rotate:-2deg}
.prose{max-width:66ch;display:grid;gap:18px;font-size:18.5px}
.prose h2{font-size:30px;margin-top:12px}
.hl{position:relative;display:inline-block;color:var(--hlfg);font-style:normal;isolation:isolate;padding:.02em .22em 0;margin:0 .02em}
.hl::before{content:"";position:absolute;inset:-.06em -.04em .0em;background:var(--hlbg);border-radius:var(--org);z-index:-1;rotate:-2.5deg}
@container site (max-width:760px){.site h1{font-size:40px}.site h2{font-size:32px}.site h3{font-size:20px}.lead{font-size:18.5px}.prose{font-size:17.5px}}

/* ---------- Encabezado ---------- */
.hdr{position:sticky;top:var(--top);z-index:30;background:var(--crema);color:var(--verde);border-bottom:3px solid var(--verde);--pb:var(--naranja);--pf:var(--verde)}
.hdr .in{display:flex;align-items:center;gap:22px;min-height:var(--hh)}
.logo{display:flex;align-items:center;text-decoration:none;flex:0 0 auto;color:var(--verde);transition:rotate .3s cubic-bezier(.3,1.6,.5,1)}
.logo:hover{rotate:-4deg}
.logo .ill{height:48px;width:auto}
.mainnav{display:flex;gap:2px;flex-wrap:nowrap}
.mainnav a{white-space:nowrap;padding:9px 12px 7px;text-decoration:none;font-family:var(--fd);font-weight:600;text-transform:uppercase;font-size:15px;letter-spacing:.03em;border-radius:var(--org);transition:background .2s,rotate .2s}
.mainnav a:hover{background:var(--crema2);rotate:-3deg}
.mainnav a.on{background:var(--verde);color:var(--crema);rotate:-2deg}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.hdr .btn.pri{border-color:var(--verde)}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:48px;height:48px;border:2.5px solid var(--verde);background:none;border-radius:var(--org);cursor:pointer;text-decoration:none;color:var(--verde);transition:rotate .2s}
.iconbtn:hover{background:var(--crema2);rotate:8deg}
.badge{position:absolute;top:-6px;right:-6px;min-width:23px;height:23px;border-radius:12px;background:var(--rojo);color:var(--crema);font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--crema)}
.burger{display:none}
.acct{position:relative}
.acct summary{list-style:none;display:flex;align-items:center;gap:6px;min-height:48px;padding:0 15px;border:2.5px solid var(--verde);border-radius:999px;cursor:pointer;font-weight:800;font-size:15px}
.acct summary::-webkit-details-marker{display:none}
.acct .menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surf);border:2.5px solid var(--verde);border-radius:var(--orgc);min-width:220px;display:grid;padding:8px;z-index:5;box-shadow:6px 6px 0 var(--naranja)}
.acct .menu a,.acct .menu button{display:block;text-align:left;padding:10px 12px;text-decoration:none;border:0;background:none;cursor:pointer;font-size:15.5px;border-radius:12px;font-weight:700}
.acct .menu a:hover,.acct .menu button:hover{background:var(--crema)}
.lnk{white-space:nowrap;font-weight:800;text-underline-offset:5px;text-decoration-thickness:2px}
.mpanel{border-top:2px solid var(--verde);padding-block:12px 22px;display:grid;gap:2px;background:var(--crema)}
.mpanel a{display:block;padding:12px 0;font-size:22px;font-family:var(--fd);font-weight:700;text-transform:uppercase;text-decoration:none;border-bottom:2px dashed var(--line)}
.mpanel .btnrow{margin-top:12px}
@container site (max-width:1260px){.mainnav{display:none}.burger{display:inline-grid}}
@container site (max-width:760px){.hide-n{display:none!important}.hdr{--hh:66px}.hdr .in{gap:10px}.logo .ill{height:40px}}
.cohdr{background:var(--crema);border-bottom:3px solid var(--verde)}
.cohdr .in{display:flex;align-items:center;gap:16px;min-height:70px}
.cohdr .logo .ill{height:40px}
.admhdr{background:var(--verde);color:var(--crema);border-bottom:3px solid var(--naranja)}
.admhdr .in{display:flex;align-items:center;gap:14px;min-height:64px}
.admhdr .ill{height:34px;width:auto;color:var(--naranja)}
.admhdr b{font-family:var(--fd);text-transform:uppercase;font-size:18px}
.admhdr .chip.ex{color:var(--crema)}
.admhdr .btn.ter{color:var(--crema)}

/* ---------- Botones y controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:4px 26px 0;border:3px solid var(--pb);border-radius:var(--org);font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:.03em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap;line-height:1;text-align:center;transition:translate .2s cubic-bezier(.3,1.6,.5,1),rotate .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,background .2s,color .2s}
.btn .i{margin-top:-4px}
.btn.pri{background:var(--pb);color:var(--pf)}
.btn.pri:hover{translate:-2px -3px;rotate:-2deg;box-shadow:5px 6px 0 var(--sh)}
.btn:active{translate:0 0;rotate:0deg;box-shadow:none;scale:.97}
.btn.sec{background:transparent;color:var(--fg);border-color:var(--fg)}
.btn.sec:hover{background:var(--fg);color:var(--bg);rotate:2deg}
.btn.ter{border-color:transparent;background:none;color:var(--fg);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px;padding:0 6px;min-height:42px;font-family:var(--ft);font-weight:800;font-size:15.5px;text-transform:none;letter-spacing:0}
.btn.ter:hover{rotate:0deg;translate:0 0}
.btn.sm{min-height:44px;padding:3px 18px 0;font-size:15px}
.btn.block{width:100%}
.btn:disabled{background:transparent;color:var(--fg);border:3px dashed var(--fg);opacity:.62;cursor:not-allowed;box-shadow:none;rotate:0deg;translate:0 0}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btnrow.center{justify-content:center}
.btnrow.sm{gap:8px;margin-top:10px}
.btnrow.end{justify-content:flex-end}
@container site (max-width:480px){.btnrow:not(.keep)>.btn{flex:1 1 100%}}
.fld{display:grid;gap:6px;border:0;padding:0;margin:0;min-width:0}
.fld>label,.fld legend{font-weight:800;font-size:16px;padding:0}
.fld .opt{font-weight:500;color:var(--mut);font-size:14px}
.fld input:not([type=checkbox]):not([type=radio]),.fld select,.fld textarea{width:100%;min-height:52px;border:2.5px solid var(--verde);border-radius:18px;padding:11px 15px;background:var(--surf);color:var(--verde)}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:3px solid var(--naranja);outline-offset:1px}
.fld input[readonly]{background:var(--crema);border-style:dashed}
.help{font-size:14.5px;color:var(--mut)}
.ferr{display:flex;gap:6px;align-items:flex-start;font-size:15px;font-weight:800;color:var(--rojo)}
.ferr .i{width:18px;height:18px}
.fld.bad input:not([type=checkbox]):not([type=radio]),.fld.bad select,.fld.bad textarea{border:3px dashed var(--rojo);background:#FFF4EE;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cnt{justify-self:end;font-size:12.5px;color:var(--mut);font-family:var(--fm)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:16px;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:1px;accent-color:var(--verde);flex:0 0 auto}
.radios{display:grid;gap:10px}
.ropt{display:flex;gap:10px;align-items:flex-start;border:2.5px solid var(--line);border-radius:var(--orgc);padding:15px 17px;cursor:pointer;background:var(--surf);color:var(--verde);transition:rotate .2s,box-shadow .2s}
.ropt:has(input:checked){border-color:var(--verde);box-shadow:5px 5px 0 var(--naranja);rotate:-.6deg}
.ropt input{width:22px;height:22px;margin-top:1px;accent-color:var(--verde);flex:0 0 auto}
.ropt small{display:block;color:var(--tinta2);font-size:14px}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{position:relative}
.vchip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.vchip span{display:inline-flex;align-items:center;min-height:46px;min-width:54px;justify-content:center;padding:0 16px;border:2.5px solid var(--verde);border-radius:var(--org);font-weight:800;font-size:15px;background:var(--surf);color:var(--verde);transition:rotate .2s cubic-bezier(.3,1.6,.5,1)}
.vchip input:checked+span{background:var(--verde);color:var(--crema);rotate:-4deg}
.vchip input:focus-visible+span{outline:3px solid var(--naranja);outline-offset:2px}
.form{display:grid;gap:20px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@container site (max-width:560px){.form .row2{grid-template-columns:1fr}}
fieldset.box{border:2.5px solid var(--line);border-radius:var(--orgc);padding:22px;display:grid;gap:16px;margin:0;background:var(--surf);color:var(--verde)}
fieldset.box>legend{font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:20px;padding:0 8px}
.qty{justify-self:start;width:max-content;display:inline-flex;align-items:stretch;border:2.5px solid var(--verde);border-radius:999px;height:48px;overflow:hidden;background:var(--surf);color:var(--verde)}
.qty button{width:48px;border:0;background:none;font-size:20px;cursor:pointer;font-weight:800}
.qty button:hover{background:var(--crema)}
.qty input,.qty output{width:50px;border:0;border-inline:2px solid var(--line);text-align:center;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* ---------- Ilustración ---------- */
.art{position:relative;display:grid;place-items:center;background:var(--bg);color:var(--fg);border-radius:var(--orgc);overflow:hidden;max-width:100%;container-type:inline-size;isolation:isolate}
.art .art-i{width:56%;height:56%;color:var(--i);transform:rotate(var(--rot,-8deg));transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
a:hover .art .art-i,.art:hover .art-i{transform:rotate(calc(var(--rot,-8deg) * -1)) scale(1.08)}
.art .art-cap{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);background:var(--fg);color:var(--bg);font-weight:800;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 11px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art .art-big{position:absolute;left:18px;right:18px;bottom:16px;font-family:var(--fd);font-weight:700;font-size:clamp(22px,12cqi,60px);line-height:.92;text-transform:uppercase;color:var(--fg);text-wrap:balance}
.art.cov .art-i{position:absolute;width:48%;height:58%;right:-4%;top:-2%}
.art.cov .art-cap{top:14px;bottom:auto}
.art.cov-long .art-big{font-size:clamp(20px,6cqi,44px);line-height:1;right:28%}
@container (max-width:150px){.art .art-cap{display:none}.art .art-big{font-size:16px}}
.qr{background:#fff;border-radius:18px;padding:10px;display:block;max-width:100%}
.qr svg{display:block;width:100%;height:auto;color:var(--verde)}
.qr.void{opacity:.35}
.map{background:var(--agua)}
.map svg.roads{position:absolute;inset:0;width:100%;height:100%;color:var(--crema)}
.map .pin{position:absolute;left:52%;top:40%;width:58px;height:58px;color:var(--naranja);transform:translate(-50%,-50%);animation:bob 2.4s ease-in-out infinite}
.cam{background:var(--verde);color:var(--crema)}
.cam::before{content:"";position:absolute;inset:18%;border:4px solid var(--naranja);border-radius:18px;clip-path:polygon(0 0,28% 0,28% 6%,6% 6%,6% 28%,0 28%,0 72%,6% 72%,6% 94%,28% 94%,28% 100%,72% 100%,72% 94%,94% 94%,94% 72%,100% 72%,100% 28%,94% 28%,94% 6%,72% 6%,72% 0)}

.poster{display:grid;gap:8px;text-decoration:none;color:inherit}
.pst{position:relative;display:block;aspect-ratio:3/4;border-radius:var(--orgc);overflow:hidden;background:var(--bg);color:var(--fg);padding:16px;transition:translate .25s cubic-bezier(.3,1.6,.5,1),rotate .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s;container-type:inline-size}
.pst .pst-i{position:absolute;width:82%;height:62%;right:-14%;top:6%;color:var(--i);animation:sway 5.5s ease-in-out infinite alternate}
.poster:nth-child(2n) .pst-i{animation-duration:6.6s;animation-delay:-2s}
.poster:nth-child(3n) .pst-i{animation-duration:4.8s;animation-delay:-1s}
@keyframes sway{from{transform:rotate(-18deg) translateY(0)}to{transform:rotate(-6deg) translateY(-5%)}}
.pst .pst-e{position:relative;font-weight:800;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;border:2px solid currentColor;border-radius:999px;padding:3px 10px 2px}
.pst .pst-n{position:absolute;left:16px;right:14px;bottom:46px;font-family:var(--fd);font-weight:700;font-size:clamp(20px,13cqi,44px);line-height:.95;text-transform:uppercase;text-wrap:balance}
.pst .pst-g{position:absolute;left:16px;bottom:14px;font-weight:800;font-size:13px;background:var(--fg);color:var(--bg);border-radius:999px;padding:3px 11px 2px;max-width:calc(100% - 30px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-agua.pst .pst-g{background:var(--verde);color:var(--crema)}
.poster:hover .pst,.poster:focus-visible .pst{translate:-4px -5px;rotate:-2deg;box-shadow:8px 9px 0 var(--verde)}
.poster:nth-child(2n):hover .pst{rotate:2deg}
.t-verde .poster:hover .pst{box-shadow:8px 9px 0 var(--naranja)}
.poster .pg{font-size:14.5px;color:var(--mut);font-weight:700}
.pst.big .pst-n{font-size:clamp(34px,14cqi,72px);bottom:62px}
.pst.big .pst-g{font-size:15px;bottom:20px}

/* ---------- Componentes ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:800;border:2px solid currentColor;border-radius:999px;padding:2px 12px 1px;white-space:nowrap;line-height:1.55;vertical-align:middle}
.chip.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.dash{border-style:dashed}
.chip.ex{font-family:var(--fm);font-weight:500;font-size:11px;border-width:1.5px;border-style:dashed;opacity:.9}
.card{background:var(--bg);color:var(--fg);border:2.5px solid var(--line);border-radius:var(--orgc)}
.card.pad{padding:28px}
a.card{text-decoration:none;display:block;transition:translate .2s cubic-bezier(.3,1.6,.5,1),rotate .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,border-color .2s}
a.card:hover{border-color:var(--verde);translate:-3px -4px;rotate:-1deg;box-shadow:7px 7px 0 var(--naranja)}
.card.ghost{background:transparent;color:inherit;border:2.5px dashed currentColor;--fg:currentColor;--mut:currentColor;--line:currentColor}
.al{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:var(--orgc);font-size:16px;background:var(--surf);color:var(--verde);border:2.5px solid var(--verde)}
.al .i{margin-top:2px}
.al .al-t{font-weight:800}
.al.ok .i{color:var(--agua)}
.al.err{border:3px dashed var(--rojo);background:#FFF4EE}
.al.err .i,.al.err .al-t{color:var(--rojo)}
.al.info{border-color:var(--agua)}
.al.warn{border-color:var(--naranja);border-width:3px;background:#FDF1DC}
.pnote{border:1.5px dashed #888;background:#fff;color:#333;padding:12px 14px;font-family:var(--fm);font-size:12.5px;line-height:1.5;display:grid;gap:8px;border-radius:8px}
.pnote .pn-t{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#666}
.pnote .btnrow{gap:6px}
.pnote .btn{font-family:var(--fm);font-weight:500;font-size:12px;min-height:34px;padding:0 10px;border-width:1.5px;border-radius:4px;text-transform:none;letter-spacing:0;--pb:#333;--pf:#fff;--fg:#333;--bg:#fff}
.pnote .btn:hover{rotate:0deg;translate:0 0;box-shadow:none}
.steps{list-style:none;padding:0;margin:0;display:flex;gap:8px;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px;font-size:15.5px;color:var(--mut);font-weight:700}
.steps li+li::before{content:"";width:26px;height:3px;border-radius:2px;background:var(--line)}
.steps .sn{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--org);border:2.5px solid var(--line);font-size:15px;font-weight:800;background:var(--surf);font-family:var(--fd)}
.steps .sn .i{width:16px;height:16px}
.steps li.now{color:var(--verde)}
.steps li.now .sn{background:var(--naranja);color:var(--verde);border-color:var(--verde);rotate:-8deg}
.steps li.done{color:var(--verde)}
.steps li.done .sn{border-color:var(--verde);background:var(--verde);color:var(--crema)}
@container site (max-width:560px){.steps .sl{display:none}.steps li.now .sl{display:inline}.steps li+li::before{width:12px}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 12px}
.tabs a,.tabs button{padding:9px 17px 7px;text-decoration:none;font-weight:800;font-size:15.5px;border:2.5px solid var(--verde);background:var(--surf);color:var(--verde);border-radius:var(--org);cursor:pointer;white-space:nowrap;transition:rotate .2s}
.tabs .on{background:var(--verde);color:var(--crema);rotate:-2deg}
.tabs a:hover,.tabs button:hover{background:var(--crema2);rotate:2deg}
.tabs .on:hover{background:var(--verde)}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;font-size:15px;color:var(--mut);padding-top:26px;font-weight:700}
.crumbs a{color:var(--verde)}
.tblw{overflow-x:auto;border:2.5px solid var(--line);border-radius:var(--r);background:var(--surf);color:var(--verde)}
.tbl{border-collapse:collapse;width:100%;font-size:15.5px;min-width:560px}
.tbl th,.tbl td{text-align:left;padding:13px 15px;border-bottom:1.5px solid var(--line);vertical-align:middle}
.tbl th{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta2);background:var(--crema)}
.tbl tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}
.empty{border:3px dashed var(--line);border-radius:var(--orgc);padding:40px 24px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surf);color:var(--verde)}
.empty .ill{width:68px;height:68px;color:var(--naranja);animation:spin 18s linear infinite}
.empty-t{font-family:var(--fd);font-weight:700;font-size:24px;text-transform:uppercase}
.state{padding-block:72px}
.state-box{max-width:660px;margin:0 auto;text-align:center;display:grid;gap:16px;justify-items:center}
.state-box>.i{width:92px;height:92px;padding:20px;border-radius:var(--org);background:var(--naranja);color:var(--verde);stroke-width:2.2;animation:wob 3s ease-in-out infinite}
.state-box .lead{margin:0 auto}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.05)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--verde);color:var(--crema);padding:13px 20px;border-radius:var(--org);display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);font-size:15.5px;font-weight:700;box-shadow:6px 6px 0 var(--naranja);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.6) rotate(-6deg)}to{transform:translateX(-50%)}}
.toast a,.toast button{color:var(--naranja);font-weight:800;background:none;border:0;cursor:pointer;text-decoration:underline;padding:4px;font-size:15px}
.progress{height:16px;border:2.5px solid var(--verde);border-radius:999px;overflow:hidden;background:var(--surf)}
.progress>div{height:100%;background:repeating-linear-gradient(-45deg,var(--naranja) 0 12px,#ECA637 12px 24px);border-radius:999px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:16px}
.kv dt{color:var(--mut);font-weight:600}
.kv dd{margin:0;font-weight:800}
.list{display:grid;gap:0;border:2.5px solid var(--line);border-radius:var(--r);background:var(--surf);color:var(--verde)}
.list>*{padding:15px 18px;border-bottom:1.5px solid var(--line)}
.list>*:last-child{border-bottom:0}
details.acc{border-bottom:2.5px dashed var(--line)}
details.acc summary{cursor:pointer;padding:20px 0;font-weight:800;font-size:19px;list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
details.acc summary::after{content:"+";display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:var(--org);background:var(--verde);color:var(--crema);font-size:22px;line-height:1;transition:rotate .3s cubic-bezier(.3,1.6,.5,1),background .2s}
details.acc[open] summary::after{content:"+";rotate:135deg;background:var(--naranja);color:var(--verde)}
details.acc .ans{padding-bottom:20px;color:var(--mut);max-width:70ch}
.ticket{display:grid;grid-template-columns:1fr 260px;border-radius:34px;overflow:hidden;box-shadow:9px 9px 0 var(--naranja)}
.ticket .tl{padding:30px;display:grid;gap:14px;position:relative;overflow:hidden}
.ticket .tl .ill.bg{position:absolute;right:-50px;bottom:-60px;width:240px;height:240px;color:var(--agua);opacity:.4;animation:spin 40s linear infinite}
.ticket .tl>*{position:relative}
.ticket .tr{border-left:4px dashed var(--verde);padding:24px;display:grid;gap:10px;justify-items:center;align-content:center;background:var(--surf);color:var(--verde)}
.code{font-family:var(--fm);font-size:20px;font-weight:500;letter-spacing:.08em}
@container site (max-width:640px){.ticket{grid-template-columns:1fr}.ticket .tr{order:-1;border-left:0;border-bottom:4px dashed var(--verde)}}

/* ---------- Bandas, ondas y héroe ---------- */
.band{padding-block:96px 88px;position:relative;content-visibility:auto;contain-intrinsic-size:auto 900px}
.band.alt{--bg:var(--crema);background:var(--crema)}
.band.dark{--bg:var(--verde);--fg:var(--crema);--mut:var(--crema-mut);--hlbg:var(--naranja);--hlfg:var(--verde);--i:var(--agua);--pb:var(--naranja);--pf:var(--verde);--line:rgba(246,227,205,.28);--sh:var(--agua);background:var(--verde);color:var(--crema)}
.wave{position:absolute;top:-1px;left:0;width:100%;height:52px;display:block;pointer-events:none}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:16px 0 36px}
.sec-h h2{font-size:70px;line-height:.95;max-width:15ch;rotate:-1deg;transform-origin:left bottom}
.sec-h a.lnk{color:var(--fg)}
@container site (max-width:760px){.band{padding-block:72px 56px}.sec-h h2{font-size:40px}.wave{height:30px}}
.g{display:grid;gap:28px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@container site (max-width:960px){.g4{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container site (max-width:760px){.g3,.g2{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.g3.keep2{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}

.hero-band{position:relative;overflow:hidden;padding-bottom:40px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:56px 80px}
.hero-t{display:grid;gap:22px;justify-items:start;align-content:center;position:relative;z-index:2}
.hero-t>.btnrow{justify-self:stretch}
.facts{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.facts li{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17.5px}
.mega{display:grid;font-family:var(--fd);text-transform:uppercase;line-height:.84}
.mega .m1{font-family:var(--fde);font-size:40px;color:var(--agua);letter-spacing:.04em;margin:0 0 10px 6px;rotate:-4deg;transform-origin:left;width:fit-content}
.mega .m2,.mega .m3{font-size:150px;display:flex;flex-wrap:nowrap}
.mega .m2{color:var(--crema)}
.mega .m3{color:var(--naranja);font-family:var(--fde);margin-left:.18em}
.wob>span{display:inline-block;animation:bob 3.2s ease-in-out infinite;animation-delay:calc(var(--i) * -.22s)}
.wob>span:nth-child(odd){--tilt:-3deg}
.wob>span:nth-child(even){--tilt:3deg}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--tilt,0deg))}50%{transform:translateY(-7%) rotate(calc(var(--tilt,0deg) * -1))}}
.tags{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tag{font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:22px;line-height:1;padding:11px 18px 7px;border-radius:var(--org);rotate:var(--r,0deg);border:3px solid transparent}
.tag.tag-o{border-color:var(--crema);color:var(--crema);background:transparent}
.hero-art{position:relative;aspect-ratio:1/1;width:100%;max-width:580px;justify-self:center}
.blob{position:absolute;border-radius:var(--org)}
.blob.b1{inset:7%;background:var(--naranja);animation:spin 48s linear infinite}
.blob.b2{width:34%;height:34%;right:0;top:2%;background:var(--agua);animation:spin 30s linear infinite reverse}
.blob.b3{width:20%;height:20%;left:4%;bottom:12%;background:var(--crema);animation:spin 22s linear infinite}
.sun{position:absolute;inset:22%;color:var(--verde);animation:sunbob 7s ease-in-out infinite}
.sun .ill{width:100%;height:100%}
@keyframes sunbob{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.04)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{position:absolute;left:var(--x);top:var(--y);width:var(--s,15%);aspect-ratio:1;color:var(--c);animation:float var(--d,6s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
.fl .ill{width:100%;height:100%}
@keyframes float{from{transform:translate(0,0) rotate(var(--r0,-12deg))}to{transform:translate(var(--dx,8px),var(--dy,-16px)) rotate(var(--r1,10deg))}}
.rbadge{position:absolute;left:-4%;bottom:-2%;width:34%;aspect-ratio:1;z-index:3}
.rbadge svg.ring{width:100%;height:100%;animation:spin 20s linear infinite;overflow:visible}
.rbadge .core{position:absolute;inset:27%;display:grid;place-items:center;border-radius:50%;background:var(--rojo);color:var(--crema);font-family:var(--fd);font-weight:700;font-size:clamp(16px,3.2cqi,28px);line-height:.9;text-align:center;rotate:-10deg}
.ed1{position:absolute;right:4%;bottom:10%;z-index:3;background:var(--crema);color:var(--verde);font-family:var(--fde);font-weight:700;text-transform:uppercase;font-size:clamp(16px,3cqi,26px);padding:12px 18px 8px;border-radius:var(--org);rotate:8deg;box-shadow:5px 5px 0 var(--verde);animation:wob 4s ease-in-out infinite}
@container site (max-width:1100px){.mega .m2,.mega .m3{font-size:118px}}
@container site (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:32px 64px}.hero-art{max-width:460px}}
@container site (max-width:520px){.mega .m2,.mega .m3{font-size:74px}.mega .m1{font-size:28px}.tag{font-size:18px}}

.ribbons{position:relative;z-index:4;height:150px;margin-top:-62px;margin-bottom:-30px;overflow:hidden;pointer-events:none}
.rib{position:absolute;left:-6%;width:112%;border-block:3px solid var(--verde);padding-block:13px 9px;overflow:hidden}
.rib.r1{top:30px;rotate:-3.2deg}
.rib.r2{top:58px;rotate:2.4deg}
.rib-t{display:flex;gap:28px;align-items:center;width:max-content;font-family:var(--fd);font-weight:700;font-size:32px;text-transform:uppercase;white-space:nowrap;animation:marq 46s linear infinite}
.rib-t.rev{animation-direction:reverse;animation-duration:54s}
.rib-t .ill{width:34px;height:34px}
.r1 .rib-t .ill{color:var(--crema)}
.r2 .rib-t .ill{color:var(--naranja)}
@keyframes marq{to{transform:translateX(-50%)}}
@container site (max-width:760px){.ribbons{height:118px;margin-top:-48px}.rib-t{font-size:22px}.rib-t .ill{width:24px;height:24px}.rib.r2{top:50px}}

.statement{font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:56px;line-height:1.02;max-width:20ch;text-wrap:balance}
@container site (max-width:760px){.statement{font-size:32px}}
.about{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px;align-items:center;margin-bottom:52px}
.about-art{position:relative;aspect-ratio:1/1;max-width:340px;justify-self:center;width:100%}
.about-art .blob.b1{inset:4%;background:var(--agua);animation-duration:38s}
.about-art .sun{inset:16%;color:var(--crema)}
@container site (max-width:860px){.about{grid-template-columns:1fr}.about-art{max-width:240px}}
.pillars{gap:22px}
.pillar{display:grid;gap:10px;align-content:start;padding:26px;border-radius:var(--orgc);background:var(--surf);border:2.5px solid var(--verde)}
.pillar:nth-child(1){rotate:-1.2deg}.pillar:nth-child(2){rotate:.8deg;background:var(--naranja);border-color:var(--naranja);--mut:var(--verde)}.pillar:nth-child(3){rotate:-.6deg}
.pillar .pi{width:72px;height:72px;display:grid;place-items:center;border-radius:var(--org);background:var(--verde);color:var(--naranja)}
.pillar:nth-child(2) .pi{background:var(--crema);color:var(--verde)}
.pillar .pi .ill{width:62%;height:62%}
.pillar:hover .pi .ill{animation:wob .8s ease-in-out}
.rgrid{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:16px}
.rgrid a{display:block;text-decoration:none;min-width:0;border-radius:var(--orgc);transition:translate .2s cubic-bezier(.3,1.6,.5,1),rotate .2s,box-shadow .2s}
.rgrid a .art{height:100%;min-height:180px}
.rgrid a:first-child{grid-row:span 2}
.rgrid a:first-child .art{min-height:380px}
.rgrid a:hover{translate:-3px -4px;rotate:-1.2deg;box-shadow:8px 8px 0 var(--naranja)}
@container site (max-width:760px){.rgrid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding-bottom:12px}.rgrid a{flex:0 0 82%;scroll-snap-align:start}.rgrid a .art,.rgrid a:first-child .art{min-height:0;aspect-ratio:4/3;height:auto}}

.cal{display:grid;gap:26px;justify-items:start}
.bigdate{display:flex;align-items:flex-end;gap:8px;font-family:var(--fd);font-weight:700;text-transform:uppercase;line-height:.78;color:var(--verde)}
.bigdate .d{font-size:230px;letter-spacing:-.02em}
.bigdate .mth{display:grid;gap:8px;margin-bottom:12px}
.bigdate .mth span:first-child{font-family:var(--fde);font-size:86px;background:var(--crema);padding:12px 18px 2px;border-radius:var(--org);rotate:-7deg;box-shadow:6px 6px 0 var(--verde)}
.bigdate .mth span:last-child{font-size:40px;padding-left:12px}
@container site (max-width:760px){.bigdate .d{font-size:150px}.bigdate .mth span:first-child{font-size:58px}.bigdate .mth span:last-child{font-size:28px}}
.cdbox{display:grid;gap:16px;justify-items:start}
.cd{display:flex;gap:14px;flex-wrap:wrap}
.cd>div{background:var(--crema);color:var(--verde);border:3px solid var(--verde);border-radius:var(--orgc);min-width:108px;padding:16px 10px 10px;text-align:center;display:grid;box-shadow:5px 6px 0 var(--verde)}
.cd>div:nth-child(1){rotate:-3deg}.cd>div:nth-child(2){rotate:2deg}.cd>div:nth-child(3){rotate:-1.5deg}
.cd b{font-family:var(--fd);font-size:58px;line-height:1;font-variant-numeric:tabular-nums;font-weight:700;display:inline-block}
.cd b.tick{animation:tick .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes tick{from{transform:translateY(-35%) rotate(-10deg) scale(.85)}to{transform:none}}
.cd span{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-top:6px}
.cdstate{font-family:var(--fd);font-size:48px;font-weight:700;line-height:1;text-transform:uppercase}
@container site (max-width:480px){.cd>div{min-width:0;flex:1}.cd b{font-size:38px}}
.ed{display:grid;grid-template-columns:96px 1fr;gap:18px;padding:18px}
a.card.ed{display:grid}
.ed-d{background:var(--verde);color:var(--crema);border-radius:var(--org);display:grid;place-items:center;text-align:center;font-family:var(--fd);font-weight:700;line-height:1;padding:12px 4px 8px;font-size:16px;align-self:start;min-height:96px;text-transform:uppercase;rotate:-4deg}
.ed-d b{font-size:40px;display:block}
.ed.ghost .ed-d{background:transparent;border:2.5px dashed currentColor;color:inherit;rotate:0deg}

.tix{display:grid;grid-template-columns:minmax(0,1fr) 300px;border-radius:40px;position:relative;filter:drop-shadow(9px 10px 0 var(--naranja))}
.tix-l{padding:40px 40px 36px;border-radius:40px 0 0 40px}
.tix-r{border-radius:0 40px 40px 0;display:grid;place-items:center;align-content:center;gap:8px;text-align:center;padding:30px;border-left:5px dashed var(--verde);position:relative;overflow:hidden}
.tix-r .p{font-family:var(--fd);font-weight:700;font-size:96px;line-height:.85}
.tix-r .s{font-family:var(--fde);font-weight:700;font-size:34px;text-transform:uppercase;rotate:-6deg}
.tix-r .ill{position:absolute;width:150px;height:150px;right:-40px;top:-40px;color:var(--crema);opacity:.6;animation:spin 26s linear infinite}
.tix::before,.tix::after{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:var(--crema);right:278px;z-index:2}
.tix::before{top:-22px}.tix::after{bottom:-22px}
@container site (max-width:860px){.tix{grid-template-columns:1fr}.tix-l{border-radius:36px 36px 0 0;padding:30px 24px}.tix-r{border-radius:0 0 36px 36px;border-left:0;border-top:5px dashed var(--verde)}.tix::before,.tix::after{display:none}.tix-r .p{font-size:72px}}
.steps3{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;counter-reset:n}
.steps3 li{padding-top:4px;display:grid;gap:8px;align-content:start}
.steps3 li::before{counter-increment:n;content:counter(n);display:grid;place-items:center;width:58px;height:58px;border-radius:var(--org);background:var(--naranja);color:var(--verde);font-family:var(--fd);font-size:30px;font-weight:700;padding-top:4px;margin-bottom:4px}
.steps3 li:nth-child(1)::before{rotate:-8deg}.steps3 li:nth-child(2)::before{rotate:6deg}.steps3 li:nth-child(3)::before{rotate:-3deg}
.steps3 b{font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:24px;line-height:1}
@container site (max-width:760px){.steps3{grid-template-columns:1fr}}

.convo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
@container site (max-width:860px){.convo{grid-template-columns:1fr}}
.tiles{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;aspect-ratio:1/1;max-width:460px;width:100%;justify-self:center}
.tiles>div{display:grid;place-items:center;border-radius:var(--orgc);background:var(--bg);color:var(--i);perspective:600px}
.tiles>div .ill{width:62%;height:62%;animation:flipy 9s ease-in-out infinite;animation-delay:calc(var(--k) * -1.1s)}
@keyframes flipy{0%,82%{transform:rotateY(0) rotate(var(--rot,0deg))}91%{transform:rotateY(180deg) rotate(var(--rot,0deg))}100%{transform:rotateY(360deg) rotate(var(--rot,0deg))}}
.tiles .rbadge{left:auto;right:-6%;bottom:-8%;width:40%}

.pcard{display:grid;gap:10px;text-decoration:none;padding:12px}
a.card.pcard{display:grid;gap:8px;text-decoration:none;padding:12px 12px 18px;align-content:start}
.pcard .pt{font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:20px;line-height:1}
.post{display:grid;gap:10px;text-decoration:none;padding-bottom:4px;color:inherit}
.post .pt{font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:21px;line-height:1.05}
.post .px{color:var(--mut);font-size:16px}
.post .art{transition:translate .2s cubic-bezier(.3,1.6,.5,1),rotate .2s,box-shadow .2s}
.post:hover .art{translate:-3px -4px;rotate:-1.2deg;box-shadow:7px 7px 0 var(--naranja)}
.feat{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center;text-decoration:none;padding-block:8px;color:inherit}
@container site (max-width:760px){.feat{grid-template-columns:1fr;gap:16px}}
.side-l{display:grid;grid-template-columns:240px minmax(0,1fr);gap:44px;padding-block:34px 80px}
.sidenav{display:grid;align-content:start;gap:4px;position:sticky;top:calc(var(--top) + var(--hh) + 20px)}
.sidenav a{padding:11px 15px 9px;text-decoration:none;font-weight:800;border-radius:var(--org);font-size:16px;transition:rotate .2s}
.sidenav a:hover{background:var(--crema2);rotate:-1.5deg}
.sidenav a.on{background:var(--verde);color:var(--crema);rotate:-1.5deg}
.sidenav .eyebrow{margin-bottom:8px}
.side-c{display:grid;gap:26px;align-content:start;min-width:0}
@container site (max-width:860px){.side-l{grid-template-columns:1fr;gap:16px;padding-top:16px}.sidenav{position:static;display:flex;overflow-x:auto;gap:6px;padding:4px 2px 8px}.sidenav .eyebrow{display:none}.sidenav a{white-space:nowrap;border:2.5px solid var(--verde)}}
.adm .sidenav a.on{background:var(--naranja);color:var(--verde)}
.co{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:44px;padding-block:30px 80px;align-items:start}
.co aside{position:sticky;top:calc(var(--top) + 24px)}
@container site (max-width:860px){.co{grid-template-columns:1fr;gap:20px}.co aside{position:static;order:-1}}
.sumline{display:flex;justify-content:space-between;gap:12px;font-size:16px}
.sumline.tot{font-weight:700;font-size:21px;border-top:3px solid var(--verde);padding-top:12px;font-family:var(--fd);text-transform:uppercase}
.cline{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:start}
@container site (max-width:560px){.cline{grid-template-columns:72px minmax(0,1fr)}.cline .cl-r{grid-column:2}}
.mcta{display:none}
@container site (max-width:760px){.mcta{display:block;position:sticky;bottom:0;z-index:20;background:var(--crema);border-top:3px solid var(--verde);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));--pb:var(--verde);--pf:var(--crema);--fg:var(--verde);--bg:var(--crema)}.mcta .btn{width:100%}}

.ftr{position:relative;background:var(--verde);color:var(--crema);padding-block:70px calc(32px + env(safe-area-inset-bottom,0px));font-size:16px;--fg:var(--crema);--mut:var(--crema-mut);--bg:var(--verde)}
.ftr-big{font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:clamp(44px,9.4cqi,150px);line-height:.86;color:var(--crema);margin-bottom:40px}
.ftr-big span{display:block;color:var(--naranja);font-family:var(--fde)}
.ftr-strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px;margin-bottom:56px}
.ftr-strip>div{aspect-ratio:1/1;display:grid;place-items:center;background:var(--bg);color:var(--i);border-radius:var(--orgc)}
.ftr-strip .ill{width:58%;height:58%;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.ftr-strip>div:hover .ill{transform:rotate(20deg) scale(1.15)}
@container site (max-width:760px){.ftr-strip{grid-template-columns:repeat(6,minmax(0,1fr))}.ftr-strip>div:nth-child(n+7){display:none}}
.ftr a{color:var(--crema);text-decoration:none;font-weight:600}
.ftr a:hover{text-decoration:underline}
.ftr .cols{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:34px}
.ftr .col{display:grid;gap:9px;align-content:start}
.ftr .col .ill{width:170px;height:auto;color:var(--naranja)}
.ftr .eyebrow{color:var(--naranja);border-color:var(--naranja)}
.ftr .spons{margin-top:44px;border:2.5px dashed var(--crema-mut);border-radius:var(--orgc);padding:16px;text-align:center;font-size:14px;color:var(--crema-mut)}
.ftr .bottom{margin-top:28px;padding-top:20px;border-top:1.5px solid rgba(246,227,205,.3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--crema-mut)}
@container site (max-width:760px){.ftr .cols{grid-template-columns:1fr 1fr}.ftr .cols .col:first-child{grid-column:1 / -1}}
.subnav{display:flex;gap:8px;overflow-x:auto;padding:12px 2px;position:sticky;top:calc(var(--top) + var(--hh));background:var(--crema);z-index:10;border-bottom:2.5px dashed var(--line)}
.subnav a{white-space:nowrap;padding:8px 15px 6px;border:2.5px solid var(--verde);border-radius:var(--org);text-decoration:none;font-size:15px;font-weight:800;transition:rotate .2s}
.subnav a:hover{background:var(--verde);color:var(--crema);rotate:-2deg}
@container site (max-width:760px){.subnav{top:calc(var(--top) + 66px)}}
.comment{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px}
.av{width:46px;height:46px;border-radius:var(--org);background:var(--naranja);display:grid;place-items:center;color:var(--verde)}
.av .ill{width:70%;height:70%}
.cmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:15px}
.cacts{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.cacts .btn{min-height:34px;font-size:14.5px}
.drop{border:3px dashed var(--verde);border-radius:var(--orgc);padding:34px 20px;text-align:center;display:grid;gap:10px;justify-items:center;cursor:pointer;background:var(--surf);color:var(--verde);transition:rotate .2s,background .2s}
.drop:hover{background:var(--crema);rotate:-.6deg}
.drop>.i{width:44px;height:44px;color:var(--naranja);animation:bob 2.6s ease-in-out infinite}
.flist .fi{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center}
.tile{padding:22px;display:grid;gap:4px}
.tile b{font-family:var(--fd);font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.timeline{list-style:none;padding:0;margin:0;display:grid}
.timeline li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:16px;position:relative}
.timeline li::before{content:"";width:16px;height:16px;border-radius:50%;border:3px solid var(--verde);background:var(--surf);margin-top:4px}
.timeline li.now::before{background:var(--naranja);border-color:var(--verde);animation:wob 2s ease-in-out infinite}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:7px;top:22px;bottom:0;width:3px;background:var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:52px;align-items:start}
@container site (max-width:860px){.split{grid-template-columns:1fr;gap:28px}}
.auth{max-width:520px;margin:52px auto 76px;padding:40px 38px;display:grid;gap:20px;background:var(--surf);color:var(--verde);border-radius:var(--orgc);border:3px solid var(--verde);box-shadow:10px 10px 0 var(--naranja);position:relative}
.auth::before{content:"";position:absolute;width:96px;height:96px;right:-30px;top:-34px;border-radius:var(--org);background:var(--agua);animation:spin 24s linear infinite;z-index:-1}
.auth::after{content:"";position:absolute;width:56px;height:56px;left:-24px;bottom:30px;border-radius:var(--org);background:var(--naranja);animation:spin 18s linear infinite reverse;z-index:-1}
@container site (max-width:560px){.auth{margin:30px auto 48px;padding:28px 20px;box-shadow:6px 6px 0 var(--naranja)}.auth::before{width:60px;height:60px;right:-8px;top:-24px}}
.auth h1{font-size:46px}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:15px;font-weight:700}
.or::before,.or::after{content:"";flex:1;height:2.5px;background:var(--line);border-radius:2px}
.stack{display:grid;gap:16px}
.stack.lg{gap:30px}
.stack.sm{gap:8px}
hr.sep{border:0;border-top:2.5px dashed var(--line);margin:8px 0}

/* ---------- Aparición al desplazar (impulsada por el scroll, sin JS) ---------- */
@supports (animation-timeline: view()){
 @media (prefers-reduced-motion:no-preference){
  .band .sec-h,.band .statement,.band .g>*,.band .rgrid>a,.band .cal,.band .tix,.band .tiles,.band .convo>div:first-child,.band .about-art,.ftr-big{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 26%}
  .band .g>*:nth-child(2),.band .rgrid>a:nth-child(2),.band .rgrid>a:nth-child(4){animation-range:entry 6% cover 32%}
  .band .g>*:nth-child(3),.band .rgrid>a:nth-child(3),.band .rgrid>a:nth-child(5){animation-range:entry 12% cover 38%}
  .band .g>*:nth-child(4){animation-range:entry 18% cover 44%}
  .band .hl::before,.hero-band .hl::before{animation:mark linear both;animation-timeline:view();animation-range:entry 30% cover 40%}
 }
}
@keyframes rise{from{opacity:.15;transform:translateY(60px) rotate(-2.5deg) scale(.95)}to{opacity:1;transform:none}}
@keyframes mark{from{rotate:-7deg}to{rotate:-2deg}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===================== v3 · Tablas de madera y más naranja ===================== */
:root{
 --org:7px 3px 8px 4px / 4px 8px 3px 7px;
 --orgc:12px 6px 14px 8px / 8px 14px 6px 12px;
 --grain:repeating-linear-gradient(177deg,rgba(0,0,0,0) 0 5px,rgba(0,0,0,.075) 5px 6px,rgba(0,0,0,0) 6px 11px,rgba(255,255,255,.09) 11px 12px,rgba(0,0,0,0) 12px 19px);
 --grain-s:repeating-linear-gradient(177deg,rgba(0,0,0,0) 0 7px,rgba(0,0,0,.05) 7px 8px,rgba(0,0,0,0) 8px 15px,rgba(255,255,255,.07) 15px 16px,rgba(0,0,0,0) 16px 24px);
 --edge:inset 0 2px 0 rgba(255,255,255,.24),inset 0 -3px 0 rgba(0,0,0,.18);
 --cut:polygon(0 8%,1.5% 0,99% 4%,100% 90%,98.5% 100%,1% 95%);
 --pb:var(--naranja);--pf:var(--verde);--pbd:var(--verde);
}
.t-crema,.card,.al,.surface,.auth,.tblw,.list,.empty,.drop{--pb:var(--naranja);--pf:var(--verde);--pbd:var(--verde);--sh:var(--verde)}
.t-verde,.band.dark{--pb:var(--naranja);--pf:var(--verde);--pbd:var(--naranja);--hlbg:var(--crema);--hlfg:var(--verde);--sh:var(--agua)}
.t-naranja{--pb:var(--verde);--pf:var(--crema);--pbd:var(--verde);--sh:var(--crema)}
.t-agua{--pbd:var(--verde)}

/* Botones: tabla con vetas y dos clavos */
.btn{position:relative;border-radius:var(--org);border-color:var(--pbd);padding:4px 34px 0}
.btn.pri{background-color:var(--pb);background-image:var(--grain);box-shadow:var(--edge)}
.btn.pri:hover{box-shadow:var(--edge),5px 6px 0 var(--sh)}
.btn.pri:active{box-shadow:var(--edge)}
.btn.pri::before,.btn.pri::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:rgba(0,0,0,.4);box-shadow:inset 1px 1px 0 rgba(255,255,255,.4)}
.btn.pri::before{left:12px}.btn.pri::after{right:12px}
.btn.sm{padding:3px 26px 0}.btn.sm::before{left:9px}.btn.sm::after{right:9px}
.btn.sec{background-image:var(--grain-s)}
.btn:disabled{background-image:none}
.btn:disabled::before,.btn:disabled::after{display:none}

/* Navegación naranja */
.hdr{background:var(--naranja);background-image:var(--grain-s);--pb:var(--verde);--pf:var(--crema);--pbd:var(--verde);--sh:var(--crema)}
.mainnav a{border-radius:var(--org)}
.mainnav a:hover{background:rgba(0,59,58,.13)}
.mainnav a.on{background-color:var(--verde);background-image:var(--grain);color:var(--naranja);box-shadow:var(--edge)}
.iconbtn,.acct summary{border-radius:var(--org)}
.iconbtn:hover{background:rgba(0,59,58,.13)}
.acct summary:hover{background:rgba(0,59,58,.13)}
.badge{border-color:var(--naranja)}
.mpanel{background:var(--naranja)}
.mpanel a{border-bottom-color:rgba(0,59,58,.3)}
.cohdr{background:var(--naranja);background-image:var(--grain-s)}

/* Títulos: naranja con contorno verde sobre fondos claros; naranja limpio sobre verde */
.site h1{color:var(--naranja);-webkit-text-stroke:.1em var(--verde);paint-order:stroke fill;text-shadow:.04em .07em 0 var(--verde)}
.site .mega,.site .mega *{-webkit-text-stroke:0;text-shadow:none}
.t-verde h1,.band.dark h1{-webkit-text-stroke:0;text-shadow:.04em .06em 0 rgba(0,0,0,.35)}
.t-verde h2,.band.dark h2,.t-verde .cdstate{color:var(--naranja)}
.ftr-big{color:var(--naranja)}
.ftr-big span{color:var(--crema)}

/* Resaltados: tabla clavada detrás de la palabra */
.hl{padding:.06em .18em 0}
.hl::before{inset:.02em -.03em 0;border-radius:3px;clip-path:var(--cut);background-color:var(--hlbg);background-image:var(--grain);box-shadow:var(--edge)}

/* Etiquetas, chips y piezas pequeñas */
.tag{border-radius:3px;clip-path:var(--cut);background-image:var(--grain);box-shadow:var(--edge);padding:13px 22px 8px}
.tag.tag-o{box-shadow:none;background-image:none;clip-path:none;border-radius:var(--org)}
.eyebrow,.chip,.pst-g,.art-cap,.pst-e,.art .art-cap{border-radius:4px}
.qty{border-radius:var(--org)}
.tabs .on{background-image:var(--grain)}
.cd>div{background-image:var(--grain-s);box-shadow:var(--edge),5px 6px 0 var(--verde)}
.ed-d,.pillar .pi,.av,.state-box>.i,details.acc summary::after,.steps .sn{background-image:var(--grain);box-shadow:var(--edge)}
.bigdate .mth span:first-child{border-radius:var(--org);background-image:var(--grain);box-shadow:var(--edge),6px 6px 0 var(--verde)}
.steps3 li::before{border-radius:3px;clip-path:var(--cut);background-image:var(--grain);box-shadow:var(--edge)}
.pillar:nth-child(2){background-image:var(--grain-s)}
.ed1{border-radius:var(--org);background-image:var(--grain);box-shadow:var(--edge),5px 5px 0 var(--verde)}
.toast{border-radius:var(--org)}
.pst,.art,.tiles>div,.ftr-strip>div{background-image:var(--grain-s)}
.tix{border-radius:14px}.tix-l{border-radius:14px 0 0 14px}.tix-r{border-radius:0 14px 14px 0;background-image:var(--grain)}
@container site (max-width:860px){.tix-l{border-radius:14px 14px 0 0}.tix-r{border-radius:0 0 14px 14px}}
.ticket{border-radius:16px}
.auth::before{width:130px;height:38px;right:-34px;top:-18px;border-radius:4px;clip-path:var(--cut);background-color:var(--agua);background-image:var(--grain);animation:plk 6s ease-in-out infinite alternate;rotate:16deg}
.auth::after{width:96px;height:30px;left:-30px;bottom:40px;border-radius:4px;clip-path:var(--cut);background-color:var(--naranja);background-image:var(--grain);animation:plk 7s ease-in-out infinite alternate-reverse;rotate:-12deg}

/* Tablas del héroe y de "Sobre el proyecto" */
.plank{position:absolute;border-radius:5px;clip-path:var(--cut);background-color:var(--bg);background-image:var(--grain);box-shadow:var(--edge);animation:plk 7s ease-in-out infinite alternate}
.plank::before,.plank::after{content:"";position:absolute;top:50%;width:13px;height:13px;margin-top:-6px;border-radius:50%;background:rgba(0,0,0,.38);box-shadow:inset 2px 2px 0 rgba(255,255,255,.3)}
.plank::before{left:4%}.plank::after{right:4%}
@keyframes plk{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.hero-art .pk1{left:7%;top:17%;width:86%;height:66%;rotate:-6deg}
.hero-art .pk1::before,.hero-art .pk1::after{top:9%}
.hero-art .pk2{left:-3%;top:72%;width:68%;height:15%;rotate:9deg;animation-duration:8.5s;animation-delay:-3s}
.hero-art .pk3{left:54%;top:5%;width:42%;height:13%;rotate:8deg;animation-duration:6s;animation-delay:-1.5s}
.hero-art .sun{inset:25%}
.about-art .pk1{left:6%;top:12%;width:88%;height:72%;rotate:-5deg}
.about-art .pk1::before,.about-art .pk1::after{top:10%}
.about-art .pk2{left:18%;top:74%;width:74%;height:16%;rotate:7deg;animation-delay:-2s}
.about-art .sun{inset:22%;color:var(--verde)}
.auth .g2{grid-template-columns:1fr}
.g>.btn{white-space:normal;min-width:0;line-height:1.1}
.fld input:not([type=checkbox]):not([type=radio]),.fld select,.fld textarea,.vchip span,.ropt,fieldset.box,.drop,.empty,.list,.tblw,.al,.progress,.progress>div{border-radius:var(--org)}

/* ===================== v4 · Rojo protagonista, madera sutil, jerarquía ===================== */
:root{--rojo:#BC2313;
 --grain:repeating-linear-gradient(177deg,rgba(0,0,0,0) 0 6px,rgba(0,0,0,.045) 6px 7px,rgba(0,0,0,0) 7px 13px,rgba(255,255,255,.05) 13px 14px,rgba(0,0,0,0) 14px 22px);
 --edge:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.14);
 --pb:var(--rojo);--pf:var(--crema);--pbd:var(--rojo);--hlbg:var(--rojo);--hlfg:var(--crema)}
.t-crema,.card,.al,.surface,.auth,.tblw,.list,.empty,.drop{--pb:var(--rojo);--pf:var(--crema);--pbd:var(--rojo);--hlbg:var(--rojo);--hlfg:var(--crema);--sh:var(--verde)}
.t-verde,.band.dark{--pb:var(--rojo);--pf:var(--crema);--pbd:var(--rojo);--hlbg:var(--rojo);--hlfg:var(--crema);--sh:var(--naranja)}
.t-naranja{--pb:var(--rojo);--pf:var(--crema);--pbd:var(--rojo);--hlbg:var(--rojo);--hlfg:var(--crema);--sh:var(--verde)}
.t-agua{--hlbg:var(--rojo);--hlfg:var(--crema)}
.t-rojo{--pb:var(--crema);--pf:var(--rojo);--pbd:var(--crema);--hlbg:var(--crema);--hlfg:var(--rojo);--sh:var(--verde)}
.hdr{background-image:none;--pb:var(--rojo);--pf:var(--crema);--pbd:var(--rojo);--sh:var(--verde)}
.cohdr{background-image:none}
.mcta{--pb:var(--rojo)!important;--pf:var(--crema)!important}

/* Madera solo en acciones y etiquetas, sin clavos en botones */
.btn.pri::before,.btn.pri::after{display:none}
.btn{padding:4px 28px 0}.btn.sm{padding:3px 20px 0}
.btn.sec,.mainnav a.on,.tabs .on,.cd>div,.ed-d,.pillar .pi,.av,.state-box>.i,details.acc summary::after,.steps .sn,.bigdate .mth span:first-child,.steps3 li::before,.pillar:nth-child(2),.ed1,.pst,.art,.tiles>div,.ftr-strip>div,.tix-r,.auth::before,.auth::after{background-image:none}
.mainnav a.on{box-shadow:none;color:var(--crema)}

/* Títulos: rojo sobre claro, naranja sobre verde */
.site h1{color:var(--rojo);-webkit-text-stroke:0;text-shadow:none}
.site .mega{color:inherit}
.t-verde h1,.band.dark h1,.t-verde h2,.band.dark h2{color:var(--naranja)}
.ticket .tl h2{color:var(--naranja)}

/* Héroe: jerarquía */
.hero{gap:56px}
.hero-t{gap:24px}
.mega .m1{font-size:34px;margin-bottom:12px}
.hero-t .lead{max-width:40ch}
.hero-band .hero-t .lead{color:var(--crema)}
.hfacts{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:10px 26px;font-weight:700;font-size:17px}
.hfacts li{display:flex;align-items:center;gap:8px}
.hfacts .i{color:var(--naranja);width:22px;height:22px}
.hcta{flex-wrap:nowrap;gap:18px}
.hcta .btn.pri{min-height:58px;font-size:19px;padding:5px 32px 0}
@container site (max-width:520px){.hcta{flex-wrap:wrap}.hfacts{flex-direction:column;gap:8px}}
.hero-art .pk1{left:8%;top:14%;width:82%;height:68%;rotate:-5deg}
.hero-art .pk2{left:14%;top:22%;width:80%;height:66%;rotate:5deg;animation-duration:9s;animation-delay:-3s}
.hero-art .pk1::before,.hero-art .pk1::after{top:9%}
.hero-art .pk2::before,.hero-art .pk2::after{display:none}
.hero-art .sun{inset:23% 22% 25% 20%}
.rbadge{left:-6%;bottom:-4%;width:32%}
.rbadge .core{background:var(--rojo)}

/* Cinta única */
.ribbons{height:100px;margin-top:-50px;margin-bottom:-26px}
.rib{border-block:0;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.rib.r1{top:24px;rotate:-2deg}
.r1 .rib-t .ill{color:var(--naranja)}
@container site (max-width:760px){.ribbons{height:84px;margin-top:-40px}.rib.r1{top:20px}}

/* Pósteres: etiqueta arriba sin solapes, nombre protagonista */
.pst{display:grid;grid-template-rows:auto 1fr auto auto;gap:8px;padding:16px 16px 16px}
.pst .pst-e{justify-self:start;z-index:2;background:var(--bg)}
.pst .pst-i{right:-8%;top:18%;width:70%;height:46%;z-index:0}
.pst .pst-n{position:relative;left:auto;right:auto;bottom:auto;grid-row:3;z-index:1;font-size:clamp(24px,15cqi,46px)}
.pst .pst-g{position:relative;left:auto;bottom:auto;grid-row:4;justify-self:start;z-index:1}
.pst.big .pst-n{font-size:clamp(36px,14cqi,74px)}

/* Portadas del blog: solo ilustración; tarjeta con jerarquía título > resumen */
.art.cov .art-i{position:relative;width:46%;height:62%;right:auto;top:auto}
.post{gap:12px}
.post .pt{font-size:20px;line-height:1.08}
.post .px{font-size:15.5px}
.post>span:first-of-type .chip{font-size:12px}

/* Ticket de la boleta sin muescas ni sombra recortada */

@container site (max-width:860px){.tix-r{border-top:4px dashed rgba(246,227,205,.7)}}
.steps3 li::before{background:var(--rojo);color:var(--crema)}

.tiles>div{border-radius:var(--orgc)}

/* Pie como la versión anterior: franja de baldosas a sangre, logo crema */
.ftr{padding-block:0 calc(32px + env(safe-area-inset-bottom,0px))}
.ftr-strip{gap:0;margin-bottom:56px}
.ftr-strip>div{border-radius:0}
.ftr .col .ill{color:var(--crema)}

/* ===================== v5 · Logo animado, intro móvil, contraste, nav, contador ===================== */
/* Contraste: el icono de cada fondo siempre en un tono claramente distinto */
.t-crema{--i:var(--rojo)}
.t-naranja{--i:var(--verde)}
.t-verde,.band.dark{--i:var(--naranja)}

.art .art-cap{background:var(--verde);color:var(--crema)}

.map svg.roads{color:var(--verde);opacity:.55}
.map .pin{color:var(--rojo)}
.tix-r .ill,.ticket .tl .ill.bg{display:none}
.empty .ill,.drop>.i{color:var(--rojo)}
.al.ok .i{color:var(--verde)}
.al.info{border-color:var(--verde)}
.btn:disabled{opacity:1;color:var(--mut);border-color:var(--mut)}
.chip.ex{opacity:1}
.auth::before{background-color:var(--verde)}
.auth::after{background-color:var(--rojo)}
.rbadge svg.ring circle{stroke:var(--verde);stroke-width:4}

/* Héroe con el logo */
.hero-top{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.hlogo-h{display:grid;gap:2px;margin:0;color:var(--crema)}
.hlogo-h .aqui{font-family:var(--fde);font-weight:700;text-transform:uppercase;color:var(--naranja);font-size:42px;line-height:1;rotate:-4deg;width:fit-content;margin:0 0 6px 4px}
.hlogo{display:block;width:min(100%,560px);height:auto;color:var(--crema);overflow:visible}
.hlogo path,.in-logo path{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){
 .hlogo path{animation:lgin .6s cubic-bezier(.2,1.3,.4,1) both,lgbob 3.6s ease-in-out infinite;animation-delay:calc(var(--d) * 75ms + .2s),calc(var(--d) * 110ms + 2.2s)}
 .introing .hlogo path{animation-delay:calc(var(--d) * 75ms + 2.9s),calc(var(--d) * 110ms + 4.9s)}
 .in-logo path{animation:lgin .45s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--d) * 35ms + 1.45s)}
}
@keyframes lgin{from{opacity:0;transform:translateY(45%)}to{opacity:1;transform:none}}
@keyframes lgbob{0%,100%{transform:none}50%{transform:translateY(-4%)}}
@container site (max-width:520px){.hlogo-h .aqui{font-size:30px}}
.hero-art .pk1{left:14%;top:14%;width:74%;height:66%;rotate:-5deg}
.hero-art .pk2{left:20%;top:22%;width:72%;height:62%;rotate:5deg}
.hero-art .sun{inset:24% 26% 28% 24%}
.rbadge{left:-4%;bottom:-4%;width:30%}

/* Dos tiras paralelas, mismo estilo */
.ribbons{height:172px;margin-top:-66px;margin-bottom:-46px}
.rib.r1{top:26px;rotate:-2deg}
.rib.r2{top:92px;rotate:-2deg}
.rib .rib-t .ill{color:var(--i)!important}
@container site (max-width:760px){.ribbons{height:128px;margin-top:-48px;margin-bottom:-30px}.rib.r1{top:16px}.rib.r2{top:66px}}

/* Sobre el proyecto */
.about-art .pk1{left:10%;top:16%;width:78%;height:64%;rotate:-5deg}
.about-art .pk2{left:22%;top:72%;width:66%;height:15%;rotate:6deg}
.about-art .sun{inset:24% 26% 30% 24%;color:var(--naranja)}

/* Navegación sin bordes */
.hdr{border-bottom:0}
.cohdr{border-bottom:0}
.iconbtn,.acct summary{border:0;background:rgba(0,59,58,.1)}
.iconbtn:hover,.acct summary:hover{background:rgba(0,59,58,.2);rotate:0deg}
.hdr .btn.pri,.mpanel .btn.pri{border:0;box-shadow:0 3px 0 var(--verde)}
.hdr .btn.pri:hover{translate:0 -2px;rotate:0deg;box-shadow:0 5px 0 var(--verde)}
.mainnav a{position:relative;rotate:0deg!important}
.mainnav a::after{content:"";position:absolute;left:12px;right:12px;bottom:4px;height:3px;border-radius:2px;background:var(--verde);transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.mainnav a:hover{background:transparent}
.mainnav a:hover::after{transform:scaleX(1)}
.mainnav a.on{background:var(--verde);color:var(--crema)}
.mainnav a.on::after{display:none}
.hdr :focus-visible,.cohdr :focus-visible{outline:0;box-shadow:0 0 0 2px var(--naranja),0 0 0 4px var(--verde);border-radius:6px}

/* Cuenta regresiva por dígito */
.cd{gap:12px}
.cd>div{min-width:92px;padding:16px 8px 10px}

.dg i.old{position:absolute;inset:0;animation:dgout .45s cubic-bezier(.5,0,.75,0) forwards}
.dg i.new{animation:dgin .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes dgout{to{transform:translateY(-100%) rotateX(70deg);opacity:0}}
@keyframes dgin{from{transform:translateY(100%) rotateX(-70deg);opacity:0}to{transform:none;opacity:1}}
.cd>div:nth-child(4){rotate:2.5deg}

/* ===================== v6 · Héroe en composición de pegatinas ===================== */

/* v17: textura de yute, solo en superficies crema e ilustraciones */
.site,.band.alt,.band.t-crema,.subnav,.mcta{background-image:none}
/* yute solo en detalles y fondos cortos */
.tix-r,.pillar .pi,.ed-d,.steps3 li::before,.empty{background-image:var(--yute);background-size:260px;background-blend-mode:multiply}
.empty{background-image:var(--yute-l);background-size:300px}
.stk,.tiles>div,.ftr-strip>div,.art,.pst,.about-art .stk{background-image:var(--yute);background-size:300px;background-blend-mode:multiply}
.stk.t-verde,.tiles>div.t-verde,.ftr-strip>div.t-verde,.art.t-verde,.pst.t-verde{background-size:300px}
.rib{background-image:var(--yute);background-size:260px;background-blend-mode:multiply}
.legal-toc,.cdpanel,.al,.card,.auth,.mpanel,.hdr{background-blend-mode:normal}
/* v20: yute en el fondo beige de las páginas de formularios */
main.formbg{background-color:var(--crema);background-image:var(--yute-l);background-size:420px;background-blend-mode:multiply;min-height:70vh;display:flow-root}
.fld input:not([type=checkbox]):not([type=radio]),.fld select,.fld textarea{background-image:none}
/* v22: programa dinámico, estaciones y artistas incógnito */
.tlw{position:relative}
.tl-f{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:26px}
.tl-f label{cursor:pointer;padding:9px 18px 7px;border-radius:999px;font-weight:800;font-size:15px;color:var(--verde);background:rgba(0,59,58,.07);transition:background .2s,color .2s,rotate .2s}
.tl-f label:hover{background:rgba(0,59,58,.14)}
#pf-todo:checked~.tl-f label[for=pf-todo],#pf-artista:checked~.tl-f label[for=pf-artista],#pf-clase:checked~.tl-f label[for=pf-clase],#pf-hito:checked~.tl-f label[for=pf-hito]{background:var(--verde);color:var(--crema);rotate:-1.5deg}
#pf-todo:focus-visible~.tl-f label[for=pf-todo],#pf-artista:focus-visible~.tl-f label[for=pf-artista],#pf-clase:focus-visible~.tl-f label[for=pf-clase],#pf-hito:focus-visible~.tl-f label[for=pf-hito]{outline:3px solid var(--naranja);outline-offset:2px}
#pf-artista:checked~.tl .ti:not(.k-artista),#pf-clase:checked~.tl .ti:not(.k-clase),#pf-hito:checked~.tl .ti:not(.k-hito):not(.k-aviso){display:none}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:16px;position:relative}
.tl::before{content:"";position:absolute;left:126px;top:10px;bottom:10px;width:4px;border-radius:2px;background:repeating-linear-gradient(to bottom,rgba(0,59,58,.35) 0 9px,transparent 9px 17px)}
.ti{display:grid;grid-template-columns:104px 48px minmax(0,1fr);grid-template-areas:"h dot c";align-items:start}
.ti-h{grid-area:h;text-align:right;padding:12px 14px 0 0;margin:0;display:grid;line-height:1}
.ti-h time{font-family:var(--fd);font-weight:700;font-size:30px;color:var(--verde);font-variant-numeric:tabular-nums}
.ti-h span{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2,var(--verde));margin-top:4px}
.ti-dot{grid-area:dot;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1;margin-top:4px;rotate:-8deg;background:var(--c);color:var(--ci);box-shadow:0 4px 10px rgba(0,59,58,.2);background-image:var(--yute);background-size:200px;background-blend-mode:multiply}
.ti-dot .ill{width:58%;height:58%}
.ti-dot b{font-family:var(--fd);font-size:28px;line-height:1;padding-top:3px}
.ti-c{grid-area:c;position:relative;overflow:hidden;margin-left:14px;background:var(--c);color:var(--cf);border-radius:18px;padding:16px 22px 16px;display:grid;gap:6px;box-shadow:0 6px 16px rgba(0,59,58,.13);transition:transform .25s cubic-bezier(.3,1.5,.5,1),box-shadow .25s}
.ti-c:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 12px 24px rgba(0,59,58,.18)}
.ti-c h3{font-size:21px;line-height:1.05;color:inherit;max-width:none;position:relative;z-index:1}
.ti-c p{margin:0;color:inherit;position:relative;z-index:1}
.ti-m{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;font-weight:700;opacity:.92}
.ti-m span{display:inline-flex;align-items:center;gap:5px}
.ti-m .i{width:16px;height:16px}
.ti-m .pc{background:rgba(0,0,0,.12);padding:1px 8px;border-radius:999px}
.ti-q{position:absolute;right:14px;top:50%;translate:0 -50%;font-family:var(--fd);font-weight:700;font-size:120px;line-height:1;opacity:.16;rotate:12deg;pointer-events:none}

function festChip(){if(['definida','proximo','cero'].includes(S.fest)&&S.insc==='abierta')return '';return ({'sin-fecha':chip('Fecha por anunciar','dash'),definida:chip('Inscripción '+({abierta:'abierta','no-abierta':'próximamente',cerrada:'cerrada'}[S.insc])),proximo:chip('Faltan menos de 24 h','solid'),cero:chip('Faltan segundos','solid'),'en-curso':chip('¡Ya empezó!','solid'),finalizado:chip('Edición finalizada','dash'),pospuesto:chip('Pospuesto','dash')})[S.fest]}

function cdCells(t){const ms=Math.max(0,t-Date.now());const v=[Math.floor(ms/864e5),Math.floor(ms%864e5/36e5),Math.floor(ms%36e5/6e4),Math.floor(ms%6e4/1e3)];const L=['días','horas','min','seg'];
 return v.map((n,i)=>`<div><b aria-hidden="true">${String(n).padStart(2,'0').split('').map(d=>`<span class="dg"><i>${d}</i></span>`).join('')}</b><span>${L[i]}</span></div>`).join('')+`<span class="sr">Faltan ${v[0]} días, ${v[1]} horas y ${v[2]} minutos</span>`}

 case 'en-curso':return `<div class="cdbox cdpanel t-verde"><p class="eyebrow">Ahora</p><p class="cdstate ya">¡Ya empezó!</p><p class="muted">Programa del día y horario actual: [por definir].</p><div class="btnrow">${btn('Ver programa del día',{href:'p03'})}${btn('Compartir fotos',{href:'c05',k:'sec'})}</div></div>`;

let SECN=null;

function fld(o){const id=o.id,nm=o.name||id;const req=o.req?' data-req':'';
 const ex=`${o.min?` data-min="${o.min}"`:''}${o.max?` data-max="${o.max}"`:''}${o.match?` data-match="${o.match}"`:''}${o.auto?` autocomplete="${o.auto}"`:''}${o.ro?' readonly':''}${o.sv?` data-save="${o.sv}"`:''}`;
 const lab=`${o.l}${o.req||o.ro?'':' <span class="opt">(opcional)</span>'}`;
 const err=`<p class="ferr" hidden>${svg('alert')}<span></span></p>`;
 const help=o.help?`<p class="help" id="${id}-h">${o.help}</p>`:'';
 if(o.t==='radio'){return `<fieldset class="fld"><legend>${lab}</legend>${help}<div class="radios">${o.opts.map((x,i)=>{const v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x,sm=Array.isArray(x)&&x[2]?`<small>${x[2]}</small>`:'';return `<label class="ropt"><input type="radio" name="${nm}" value="${esc(v)}"${o.v===v?' checked':''}${i===0?req:''}${o.chg?` data-chg="${o.chg}"`:''}${o.sv?` data-save="${o.sv}"`:''}><span>${l}${sm}</span></label>`}).join('')}</div>${err}</fieldset>`}
 if(o.t==='checks'){return `<fieldset class="fld"${o.req?' data-groupreq':''}><legend>${lab}</legend>${help}<div class="vchips">${o.opts.map(x=>`<label class="vchip"><input type="checkbox" name="${nm}" value="${esc(x)}"${(o.v||[]).includes(x)?' checked':''}${o.sv?` data-save="${o.sv}"`:''}><span>${x}</span></label>`).join('')}</div>${err}</fieldset>`}
 if(o.t==='check'){return `<div class="fld"><label class="chk"><input type="checkbox" id="${id}" name="${nm}"${o.v?' checked':''}${req}${o.msg?` data-msg="${esc(o.msg)}"`:''}${o.sv?` data-save="${o.sv}"`:''}><span>${o.l}</span></label>${err}</div>`}
 let ctl;
 if(o.t==='textarea')ctl=`<textarea id="${id}" name="${nm}" rows="${o.rows||4}"${req}${ex}${o.count?` data-count="${o.count}"`:''}${o.help?` aria-describedby="${id}-h"`:''} placeholder="${esc(o.ph||'')}">${esc(o.v||'')}</textarea>${o.count?`<span class="cnt" id="${id}-cnt">${(o.v||'').length} / ${o.count}</span>`:''}`;
 else if(o.t==='select')ctl=`<select id="${id}" name="${nm}"${req}${ex}${o.chg?` data-chg="${o.chg}"`:''}><option value="">Selecciona una opción</option>${o.opts.map(x=>{const v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return `<option value="${esc(v)}"${o.v===v?' selected':''}>${l}</option>`}).join('')}</select>`;
 else ctl=`<input id="${id}" name="${nm}" type="${o.t||'text'}" value="${esc(o.v||'')}"${req}${ex}${o.help?` aria-describedby="${id}-h"`:''} placeholder="${esc(o.ph||'')}">`;
 return `<div class="fld"><label for="${id}">${lab}</label>${help}${ctl}${err}</div>`}
function posterCard(a,small){return `<a class="poster" href="#c03-${a.id}">${posterArt(a)}${small?'':`<span class="pg">${a.o}</span>`}</a>`}

function vkey(p,sel){return Object.keys(p.v).map(k=>sel[k]).join('|')}
const stockOf=(p,k)=>(k in p.st)?p.st[k]:p.def;
const soldOut=p=>p.def===0&&!Object.values(p.st).some(x=>x>0);
function prodCard(p){return `<a class="card pcard" href="#t02-${p.id}">${prodArt(p)}<span class="pt">${p.n}</span><span class="num">${money(p.p)}</span>${soldOut(p)?chip('Agotado','dash'):p.def<=3?chip('Últimas unidades'):''}</a>`}

function appChip(st){const a=APPST[st]||APPST.ninguna;return chip(a[0],a[1])}
function profPct(){const p=S.prof||{};const ok=PROF_REQ.filter(k=>Array.isArray(p[k])?p[k].length:!!p[k]).length;return Math.round(ok/PROF_REQ.length*100)}
